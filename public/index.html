<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="utf-8">
  <title>Territori</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1a2b;
      font: 13px system-ui, sans-serif;
      color: #fff
    }

    canvas {
      display: block
    }

    #menu {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
      background: #0b1a2bee
    }

    input,
    button,
    select {
      padding: 7px 11px;
      font-size: 14px;
      border-radius: 6px;
      border: 0
    }

    select {
      color: #111
    }

    button {
      background: #3b82f6;
      color: #fff;
      cursor: pointer
    }

    .h {
      position: fixed;
      background: #000b;
      padding: 6px 10px;
      border-radius: 6px
    }

    #top {
      left: 8px;
      top: 8px
    }

    #rank {
      right: 8px;
      top: 8px;
      max-height: 60vh;
      overflow: auto;
      font-size: 12px
    }

    .economic #rank {
      left: 8px;
      right: auto;
      top: auto;
      bottom: 8px;
      max-height: 35vh
    }

    #rank div {
      display: grid;
      grid-template-columns: 12px 90px 52px 42px 44px;
      gap: 4px;
      white-space: nowrap
    }

    #bot {
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      text-align: center;
      display: none
    }

    #actions {
      position: fixed;
      left: 8px;
      top: 48px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 16px);
      background: #000b;
      padding: 6px 8px;
      border-radius: 6px
    }

    #econ-panel {
      position: fixed;
      display: none;
      right: 8px;
      top: 84px;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 100px);
      box-sizing: border-box;
      overflow: auto;
      padding: 12px;
      border: 1px solid #ffffff24;
      border-radius: 10px;
      background: #101c2eef;
      box-shadow: 0 12px 40px #0008;
      z-index: 3
    }

    #econ-panel.minimized {
      width: min(240px, calc(100vw - 24px));
      overflow: hidden
    }

    #econ-panel.minimized #econ-content {
      display: none
    }

    #econ-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      cursor: move;
      touch-action: none;
      user-select: none
    }

    #econ-panel h2,
    #econ-panel h3 {
      margin: 0 0 8px
    }

    #econ-panel h2 {
      font-size: 17px
    }

    #econ-panel h3 {
      font-size: 13px;
      color: #bfdbfe
    }

    .econ-title {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .econ-info {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border: 1px solid #93c5fd;
      border-radius: 50%;
      color: #bfdbfe;
      font: 10px/1 system-ui, sans-serif;
      cursor: help
    }

    #econ-toggle {
      flex: 0 0 auto;
      padding: 3px 8px;
      background: #2a3b55;
      font-size: 16px;
      line-height: 1.2;
      cursor: pointer
    }

    #econ-summary,
    #econ-workers,
    #econ-production {
      color: #b6c4d6;
      font-size: 11px
    }

    .econ-section {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ffffff24
    }

    .econ-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px
    }

    .econ-metric {
      display: grid;
      gap: 2px;
      padding: 6px;
      border-radius: 6px;
      background: #ffffff10
    }

    .econ-metric span {
      color: #b6c4d6;
      font-size: 10px
    }

    .econ-metric strong {
      font-size: 14px
    }

    .econ-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .econ-row input[type="range"] {
      width: 130px;
      padding: 0
    }

    .econ-row input[type="number"],
    #market-good,
    #market-amount,
    #market-buy-amount,
    #expedition-mode,
    #expedition-amount {
      width: 100px;
      padding: 5px 7px
    }

    #econ-market {
      display: grid;
      gap: 5px;
      max-height: 180px;
      overflow: auto
    }

    .market-offer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 5px;
      padding: 5px;
      border-radius: 6px;
      background: #ffffff10
    }

    .market-offer button,
    .econ-section button {
      padding: 5px 7px;
      font-size: 12px
    }

    #econ-panel .muted {
      color: #b6c4d6;
      font-size: 11px
    }

    @media (max-width: 700px) {
      #econ-panel {
        max-height: 48vh
      }

      .economic #rank {
        display: none
      }
    }

    #cm {
      position: fixed;
      display: none;
      background: #111e;
      border-radius: 8px;
      padding: 6px;
      min-width: 170px;
      z-index: 5
    }

    #cm b {
      display: block;
      margin-bottom: 4px
    }

    #cm button {
      display: block;
      width: 100%;
      margin-top: 3px;
      text-align: left;
      background: #2a3b55
    }

    #card {
      position: fixed;
      display: none;
      pointer-events: none;
      background: #000d;
      padding: 6px 9px;
      border-radius: 6px;
      z-index: 4
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="menu">
    <h1>Territori</h1>
    <input id="name" placeholder="El teu nom" maxlength="16">
    <input id="room" placeholder="Codi de sala (buit = crear-ne una)" maxlength="4" style="text-transform:uppercase">
    <select id="mode">
      <option value="classic">Mode clàssic</option>
      <option value="economic">Mode econòmic: ciutats i fàbriques</option>
    </select>
    <select id="territory">
      <option value="random">Territori aleatori</option>
      <option value="americas">Amèriques</option>
      <option value="europe_africa">Europa i Àfrica</option>
      <option value="asia_pacific">Àsia i Oceania</option>
      <option value="world">Món sencer</option>
    </select>
    <button id="go">Entrar</button>
  </div>
  <div class="h" id="top"></div>
  <div class="h" id="rank"></div>
  <div id="actions">
    <span id="gamestate"></span>
    <span id="roomcode"></span>
    <span id="pct-wrap">
      <label for="pct">Enviar a l’atac</label>
      <input id="pct" type="range" min="1" max="100" value="35">
      <span id="pl">35%</span>
    </span>
    <button id="start" style="display:none">Començar Partida</button>
    <button id="restart" style="display:none">Reiniciar Partida</button>
  </div>
  <aside id="econ-panel" aria-label="Gestió econòmica">
    <header id="econ-header">
      <div>
        <h2 class="econ-title">Economia <span class="econ-info" tabindex="0" title="Arrossega aquesta capçalera per moure el panell. Les icones d’informació expliquen cada opció." aria-label="Ajuda del panell">i</span></h2>
        <div id="econ-summary"></div>
      </div>
      <button id="econ-toggle" type="button" aria-expanded="true" aria-label="Minimitzar panell" title="Minimitzar">−</button>
    </header>
    <div id="econ-content">
    <section class="econ-section">
      <h3 class="econ-title">Població i treball <span class="econ-info" tabindex="0" title="El percentatge d’exèrcit fixa quants habitants poden ser soldats. La resta són civils; reparteix-los entre aliments i producció." aria-label="Informació de població i treball">i</span></h3>
      <div class="econ-row">
        <label id="allocation-wrap" for="allocation" title="Percentatge d’habitants assignat a l’exèrcit">Exèrcit</label>
        <input id="allocation" type="range" min="0" max="100" step="1" value="35">
        <span id="allocation-label">35%</span>
      </div>
      <div class="econ-row">
        <label for="food-allocation" title="Percentatge dels civils que produeix aliments">Aliments</label>
        <input id="food-allocation" type="range" min="0" max="100" step="1" value="50">
        <span id="food-allocation-label">50%</span>
      </div>
      <div id="econ-workers" class="muted"></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Inventari <span id="inventory-info" class="econ-info" tabindex="0" aria-label="Informació d’inventari">i</span></h3>
      <div id="econ-inventory" class="econ-metrics"></div>
      <div id="econ-production"></div>
      <div class="econ-row">
        <label for="direct-buy-amount">Comprar vehicles</label>
        <input id="direct-buy-amount" type="number" min="1" step="1" value="1" aria-label="Nombre de vehicles a comprar">
      </div>
      <div class="econ-row">
        <button id="buy-cars">Comprar cotxes</button>
        <button id="buy-ships">Comprar vaixells</button>
      </div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Expedicions <span class="econ-info" tabindex="0" title="Clic esquerre sobre terra per enviar cotxes; clic dret i tria expedició marítima per enviar vaixells. Cal 1 vehicle per cada 100 soldats enviats." aria-label="Informació d’expedicions">i</span></h3>
      <div class="econ-row">
        <label for="expedition-mode">Quantitat</label>
        <select id="expedition-mode">
          <option value="percent">Percentatge de l’exèrcit</option>
          <option value="exact">Nombre exacte</option>
        </select>
      </div>
      <div class="econ-row" id="expedition-percent-row">
        <label for="expedition-percent">Percentatge</label>
        <input id="expedition-percent" type="range" min="1" max="100" value="35">
        <span id="expedition-percent-label">35%</span>
      </div>
      <div class="econ-row" id="expedition-exact-row" style="display:none">
        <label for="expedition-amount">Soldats</label>
        <input id="expedition-amount" type="number" min="5" step="1" value="100">
      </div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Mercat <span class="econ-info" tabindex="0" title="Les compres i vendes es paguen amb aliments: 1 aliment per soldat, 100 per cotxe o vaixell. Els vehicles comprats directament costen 100 recursos cadascun." aria-label="Informació del mercat">i</span></h3>
      <div class="econ-row">
        <select id="market-good" aria-label="Producte que poses a la venda">
          <option value="soldiers">Soldats</option>
          <option value="cars">Cotxes</option>
          <option value="ships">Vaixells</option>
        </select>
        <input id="market-amount" type="number" min="0" step="1" value="0" aria-label="Quantitat que poses a la venda">
        <button id="market-list">Posar a la venda</button>
      </div>
      <div class="econ-row">
        <label for="market-buy-amount">A comprar</label>
        <input id="market-buy-amount" type="number" min="1" step="1" value="1">
      </div>
      <div id="econ-market"></div>
    </section>
    </div>
  </aside>
  <div class="h" id="bot">
    <div id="hint"></div>
    <div id="code"></div>
  </div>
  <div id="cm"></div>
  <div id="card"></div>
  <script>
    const $ = id => document.getElementById(id);
    let ws, W, H, NB, me, owner, structures, structureList = [], gameMode = 'classic', off, octx, img, land = 1, zoom = 3, ox = 0, oy = 0, dirty = false, pm = {}, economy = {}, market = [], boats = [], gameState = 'lobby', host = 0, winner = 0, allies = new Set();
    const cv = $('c'), ctx = cv.getContext('2d');
    function resize() { cv.width = innerWidth; cv.height = innerHeight } onresize = resize; resize();
    function hsl(h) { const s = .6, l = .5, a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))) }; return [f(0), f(8), f(4)] }
    function color(id, i) { if (id === 255) return [14, 40, 72]; if (!id) return (i / W | 0) < H * .1 ? [205, 215, 222] : [62, 98, 66]; if (id <= NB) return hsl(id * 47 % 360); return id === me ? [59, 130, 246] : [34, 211, 238] }
    function paint(i) { const c = color(owner[i], i), d = img.data; d[4 * i] = c[0]; d[4 * i + 1] = c[1]; d[4 * i + 2] = c[2]; d[4 * i + 3] = 255; }
    $('name').value = localStorage.nom || '';
    $('room').oninput = () => {
      $('mode').disabled = !!$('room').value;
      $('territory').disabled = !!$('room').value;
    };
    $('go').onclick = () => {
      localStorage.nom = $('name').value;
      ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host);
      ws.onopen = () => ws.send(JSON.stringify({
        t: 'join',
        name: $('name').value || 'Jugador',
        room: $('room').value,
        mode: $('mode').value,
        territory: $('territory').value
      }));
      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.t === 'err') alert(m.m);
        else if (m.t === 'init') {
          W = m.w; H = m.h; NB = m.nb; me = m.me; land = m.land; gameState = m.state; host = m.host; gameMode = m.mode;
          owner = Uint8Array.from(atob(m.owner), c => c.charCodeAt(0));
          structures = Uint8Array.from(atob(m.structures), c => c.charCodeAt(0)); rebuildStructureList();
          off = document.createElement('canvas'); off.width = W; off.height = H; octx = off.getContext('2d'); img = octx.createImageData(W, H);
          for (let i = 0; i < W * H; i++)paint(i); dirty = true;
          zoom = Math.min(innerWidth / W, innerHeight / H) * .95; ox = (innerWidth - W * zoom) / 2; oy = (innerHeight - H * zoom) / 2;
          $('menu').style.display = 'none';
          $('roomcode').textContent = 'Codi de sala: ' + m.code;
          $('code').textContent = 'Sala: ' + m.code + ' (passa-li el codi al teu amic)';
          $('territory').value = m.territory;
          updateControls();
        }
        else if (m.t === 'reset') { owner = Uint8Array.from(atob(m.owner), c => c.charCodeAt(0)); structures = Uint8Array.from(atob(m.structures), c => c.charCodeAt(0)); rebuildStructureList(); boats = []; for (let i = 0; i < W * H; i++) paint(i); dirty = true; gameState = 'lobby'; winner = 0; allies.clear(); updateControls(); }
        else if (m.t === 'd') { for (let k = 0; k < m.c.length; k += 2) { owner[m.c[k]] = m.c[k + 1]; paint(m.c[k]); } dirty = true; }
        else if (m.t === 'building') {
          structures[m.i] = m.type;
          structureList = structureList.filter(([i]) => i !== m.i);
          if (m.type) structureList.push([m.i, m.type]);
        }
        else if (m.t === 'b') boats = m.b;
        else if (m.t === 's') {
          gameState = m.state; host = m.host; winner = m.winner; gameMode = m.mode;
          economy = Object.fromEntries((m.economy || []).map(p => [p.id, p]));
          market = m.market || [];
          allies = new Set(m.allies.map(x => x.slice().sort((a, b) => a - b).join(':')));
          stats(m.p); updateControls(); updateEconomicPanel();
        }
        else if (m.t === 'pactRequest' && confirm(`${m.name} et proposa un pacte. Vols acceptar-lo?`)) send({ t: 'pactReply', from: m.from, accept: true });
        else if (m.t === 'pactRequest') send({ t: 'pactReply', from: m.from, accept: false });
      };
    };
    const alive = () => pm[me] && pm[me][4];
    function rebuildStructureList() {
      structureList = [];
      for (let i = 0; i < structures.length; i++)if (structures[i]) structureList.push([i, structures[i]]);
    }
    function updateControls() {
      $('start').style.display = host === me && gameState === 'lobby' ? 'inline-block' : 'none';
      $('restart').style.display = host === me && gameState === 'over' ? 'inline-block' : 'none';
      $('pct-wrap').style.display = gameMode === 'economic' ? 'none' : 'inline';
      $('econ-panel').style.display = gameMode === 'economic' ? 'block' : 'none';
      document.body.classList.toggle('economic', gameMode === 'economic');
      $('mode').disabled = !!$('room').value;
      $('territory').disabled = !!$('room').value;
      $('gamestate').textContent = gameState === 'lobby' ? 'Sala d’espera' : gameState === 'playing' ? 'Partida en marxa' : winner ? `${pm[winner]?.[1] || 'Jugador'} ha guanyat` : 'Partida acabada';
    }
    function stats(p) {
      pm = {}; p.forEach(x => pm[x[0]] = x); const q = pm[me];
      $('top').textContent = q && q[4] ? gameMode === 'economic'
        ? `Exèrcit: ${q[3]} · Habitants: ${q[10]} · Recursos: ${q[6]} · Ciutats: ${q[8]}`
        : `Tropes: ${q[3]} · Interès: ${(q[5] * 100).toFixed(1)}% · Terra: ${(q[2] / land * 100).toFixed(1)}%`
        : 'Encara no has aparegut';
      if (q && gameMode === 'economic') {
        const allocation = document.activeElement === $('allocation') ? $('allocation').value : q[7];
        $('allocation').value = allocation;
        $('allocation-label').textContent = `${allocation}%`;
      }
      $('hint').textContent = q && q[4]
        ? gameMode === 'economic'
          ? 'Fes clic al territori objectiu per enviar una expedició · clic dret per construir · gestiona economia al panell'
          : 'Esq: atacar · Dret: menú · roda: zoom · arrossega: moure'
        : 'Fes clic esquerre a terra lliure, lluny d\'altres, per aparèixer';
      const R = $('rank'); R.textContent = '';
      const row = (a) => { const d = document.createElement('div'); a.forEach((t, i) => { const s = document.createElement('span'); if (i === 0) { const c = color(t, 0); s.style.cssText = `background:rgb(${c});height:10px;margin-top:3px`; } else s.textContent = t; d.appendChild(s); }); R.appendChild(d); return d; };
      row([0, 'Jugador', 'Tropes', gameMode === 'economic' ? 'Pobl.' : 'Int.', 'Terra']).style.opacity = .6;
      p.filter(x => x[4]).sort((a, b) => b[2] - a[2]).forEach(x => {
        const detail = gameMode === 'economic' ? Math.floor(x[10]) : (x[5] * 100).toFixed(1) + '%';
        const d = row([x[0], x[1], x[3], detail, (x[2] / land * 100).toFixed(1) + '%']);
        if (x[0] === me) d.style.fontWeight = 'bold';
      });
    }
    function updateEconomicPanel() {
      if (gameMode !== 'economic' || !economy[me]) return;
      const q = pm[me], e = economy[me];
      if (document.activeElement !== $('allocation')) $('allocation').value = q[7];
      if (document.activeElement !== $('food-allocation')) $('food-allocation').value = e.foodAllocation;
      $('allocation-label').textContent = `${q[7]}%`;
      $('food-allocation-label').textContent = `${e.foodAllocation}% dels civils`;
      $('econ-summary').textContent = `${Math.floor(q[10])} habitants · +${e.populationGrowthRate.toFixed(1)}/s`;
      $('econ-workers').textContent = `Treballadors: aliments ${e.foodWorkers} · producció ${e.productionWorkers}`;
      const inventory = $('econ-inventory');
      inventory.replaceChildren();
      for (const [label, value, rate] of [
        ['Aliments', e.food, e.foodRate],
        ['Cotxes', e.cars, e.carRate],
        ['Vaixells', e.ships, e.shipRate]
      ]) {
        const metric = document.createElement('div');
        metric.className = 'econ-metric';
        const name = document.createElement('span');
        name.textContent = label;
        const amount = document.createElement('strong');
        amount.textContent = value;
        const production = document.createElement('span');
        production.textContent = `+${rate.toFixed(1)}/s`;
        metric.append(name, amount, production);
        inventory.appendChild(metric);
      }
      $('econ-production').textContent = `Soldats +${e.recruitmentRate.toFixed(1)}/s · Capacitat ${Math.floor(e.armyCapacity)}`;
      $('inventory-info').title = `Es produeixen ${e.foodRate.toFixed(1)} aliments/s, ${e.carRate.toFixed(2)} cotxes/s i ${e.shipRate.toFixed(2)} vaixells/s. Fàbriques: cotxes ${e.carFactories}, drassanes ${e.shipyards}, armes ${e.armsFactories}. En venda: ${e.offers.soldiers} soldats, ${e.offers.cars} cotxes, ${e.offers.ships} vaixells.`;
      const directAmount = Number($('direct-buy-amount').value);
      const validDirectAmount = Number.isSafeInteger(directAmount) && directAmount > 0;
      $('buy-cars').disabled = !validDirectAmount || q[6] < directAmount * 100;
      $('buy-ships').disabled = !validDirectAmount || q[6] < directAmount * 100;
      if (document.activeElement !== $('market-amount')) {
        const selected = $('market-good').value;
        $('market-amount').value = e.offers[selected];
      }
      renderMarket();
    }
    function renderMarket() {
      const root = $('econ-market'); root.textContent = '';
      const buyer = economy[me];
      for (const seller of market) {
        if (seller.id === me) continue;
        for (const good of ['soldiers', 'cars', 'ships']) {
          if (!seller[good]) continue;
          const price = good === 'soldiers' ? 1 : 100;
          const label = { soldiers: 'soldats', cars: 'cotxes', ships: 'vaixells' }[good];
          const row = document.createElement('div'); row.className = 'market-offer';
          const description = document.createElement('span');
          description.textContent = `${seller.name}${seller.bot ? ' · bot' : ''}: ${seller[good]} ${label}`;
          description.title = `${price} aliments per unitat`;
          const requestedAmount = Number($('market-buy-amount').value);
          const amount = Number.isSafeInteger(requestedAmount) && requestedAmount > 0 ? requestedAmount : 0;
          const buy = document.createElement('button'); buy.textContent = `Comprar ${amount}`;
          buy.disabled = !amount || amount > seller[good] || !buyer || buyer.food < price * amount;
          buy.onclick = () => send({ t: 'marketBuy', seller: seller.id, good, amount });
          row.append(description, buy); root.appendChild(row);
        }
      }
      if (!root.childElementCount) root.textContent = 'No hi ha estoc a la venda.';
    }
    const econPanel = $('econ-panel'), econHeader = $('econ-header');
    $('econ-toggle').onclick = () => {
      const minimized = econPanel.classList.toggle('minimized');
      $('econ-toggle').textContent = minimized ? '+' : '−';
      $('econ-toggle').title = minimized ? 'Ampliar' : 'Minimitzar';
      $('econ-toggle').setAttribute('aria-label', minimized ? 'Ampliar panell' : 'Minimitzar panell');
      $('econ-toggle').setAttribute('aria-expanded', String(!minimized));
    };
    let panelDrag = null;
    econHeader.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('button,.econ-info')) return;
      const rect = econPanel.getBoundingClientRect();
      panelDrag = { x: e.clientX, y: e.clientY, left: rect.left, top: rect.top };
      econHeader.setPointerCapture(e.pointerId);
    });
    econHeader.addEventListener('pointermove', e => {
      if (!panelDrag) return;
      const rect = econPanel.getBoundingClientRect();
      const left = Math.max(8, Math.min(innerWidth - rect.width - 8, panelDrag.left + e.clientX - panelDrag.x));
      const top = Math.max(8, Math.min(innerHeight - rect.height - 8, panelDrag.top + e.clientY - panelDrag.y));
      econPanel.style.left = `${left}px`;
      econPanel.style.right = 'auto';
      econPanel.style.top = `${top}px`;
    });
    const stopPanelDrag = () => { panelDrag = null; };
    econHeader.addEventListener('pointerup', stopPanelDrag);
    econHeader.addEventListener('pointercancel', stopPanelDrag);
    window.addEventListener('resize', () => {
      if (!econPanel.style.left) return;
      const rect = econPanel.getBoundingClientRect();
      econPanel.style.left = `${Math.max(8, Math.min(innerWidth - rect.width - 8, rect.left))}px`;
      econPanel.style.top = `${Math.max(8, Math.min(innerHeight - rect.height - 8, rect.top))}px`;
    });
    $('start').onclick = () => send({ t: 'start' });
    $('restart').onclick = () => send({ t: 'restart' });
    $('pct').oninput = () => $('pl').textContent = $('pct').value + '%';
    $('allocation').oninput = () => $('allocation-label').textContent = `${$('allocation').value}%`;
    $('allocation').onchange = () => send({ t: 'allocate', value: $('allocation').value });
    $('food-allocation').oninput = () => $('food-allocation-label').textContent = `${$('food-allocation').value}% dels civils`;
    $('food-allocation').onchange = () => send({ t: 'jobs', value: $('food-allocation').value });
    $('expedition-mode').onchange = () => {
      const exact = $('expedition-mode').value === 'exact';
      $('expedition-percent-row').style.display = exact ? 'none' : 'flex';
      $('expedition-exact-row').style.display = exact ? 'flex' : 'none';
    };
    $('expedition-percent').oninput = () => $('expedition-percent-label').textContent = `${$('expedition-percent').value}%`;
    $('market-good').onchange = () => {
      const e = economy[me];
      if (e) $('market-amount').value = e.offers[$('market-good').value];
    };
    $('market-list').onclick = () => send({ t: 'marketList', good: $('market-good').value, amount: Number($('market-amount').value) });
    $('market-buy-amount').oninput = renderMarket;
    $('direct-buy-amount').oninput = updateEconomicPanel;
    $('buy-cars').onclick = () => send({ t: 'directBuy', good: 'cars', amount: Number($('direct-buy-amount').value) });
    $('buy-ships').onclick = () => send({ t: 'directBuy', good: 'ships', amount: Number($('direct-buy-amount').value) });
    const tile = e => [Math.floor((e.clientX - ox) / zoom), Math.floor((e.clientY - oy) / zoom)];
    const send = o => ws.send(JSON.stringify(o));
    const pct = () => gameMode === 'economic' ? Number($('expedition-percent').value) / 100 : Number($('pct').value) / 100;
    function sendExpedition(t, x, y, betray = false) {
      const selection = gameMode === 'economic'
        ? $('expedition-mode').value === 'exact'
          ? { expeditionMode: 'exact', amount: Number($('expedition-amount').value) }
          : { expeditionMode: 'percent' }
        : {};
      send({ t, x, y, pct: pct(), betray, ...selection });
    }
    function infoLine(id) {
      const p = pm[id];
      return p ? gameMode === 'economic'
        ? `${p[1]} — Exèrcit ${p[3]} · Habitants ${p[10]}`
        : `${p[1]} — Tropes ${p[3]} · Int. ${(p[5] * 100).toFixed(1)}% · Terra ${(p[2] / land * 100).toFixed(1)}%`
        : '';
    }
    function menu(e, x, y) {
      const cm = $('cm'); cm.textContent = '';
      const o = x >= 0 && y >= 0 && x < W && y < H ? owner[y * W + x] : 255;
      const add = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { cm.style.display = 'none'; f(); }; cm.appendChild(b); };
      const h = document.createElement('b'); h.textContent = o === 255 ? 'Mar' : o === 0 ? 'Terra lliure' : o === me ? 'El teu territori' : infoLine(o); cm.appendChild(h);
      if (alive()) {
        const isAlly = o > NB && allies.has([me, o].sort((a, b) => a - b).join(':'));
        if (gameMode === 'economic' && gameState === 'playing' && o === me && !structures[y * W + x]) {
          const q = pm[me];
          if (q[6] >= 60 && (!q[8] || q[10] >= q[8] * 1000)) add('Construir ciutat (60 recursos)', () => send({ t: 'build', i: y * W + x, building: 'city' }));
          if (q[8] > 0 && q[9] < 10 && q[6] >= 120) {
            add('Fàbrica de cotxes (120)', () => send({ t: 'build', i: y * W + x, building: 'carFactory' }));
            add('Drassana (120)', () => send({ t: 'build', i: y * W + x, building: 'shipyard' }));
            add('Fàbrica d’armes (120)', () => send({ t: 'build', i: y * W + x, building: 'armsFactory' }));
          }
        }
        if (gameState === 'playing' && o > NB && o !== me) {
          [10, 25, 50].forEach(p => add(`Donar ${p}% de tropes`, () => send({ t: 'give', to: o, pct: p / 100 })));
          if (!isAlly) add('Proposar pacte', () => send({ t: 'pact', to: o }));
        }
        if (gameState === 'playing' && o !== me && o !== 255) {
          const label = gameMode === 'economic' ? 'Enviar exèrcit' : `Atacar (${$('pct').value}%)`;
          if (isAlly) add(`Trair pacte i ${label.toLowerCase()}`, () => sendExpedition('atk', x, y, true));
          else add(label, () => sendExpedition('atk', x, y));
        }
        if (gameState === 'playing' && o !== me) {
          const label = gameMode === 'economic' ? 'Enviar exèrcit per mar' : `Enviar vaixell (${$('pct').value}%)`;
          if (isAlly) add(`Trair pacte i ${label.toLowerCase()}`, () => sendExpedition('boat', x, y, true));
          else add(label, () => sendExpedition('boat', x, y));
        }
      } else if (o === 0) add('Aparèixer aquí', () => send({ t: 'spawn', x, y }));
      cm.style.left = Math.min(e.clientX, innerWidth - 190) + 'px'; cm.style.top = Math.min(e.clientY, innerHeight - 150) + 'px'; cm.style.display = 'block';
    }
    let drag = null, moved = 0;
    cv.onmousedown = e => { $('cm').style.display = 'none'; drag = { x: e.clientX, y: e.clientY }; moved = 0; };
    onmousemove = e => {
      if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); ox += dx; oy += dy; drag.x = e.clientX; drag.y = e.clientY; }
      const c = $('card'); if (!owner || e.target !== cv || drag) { c.style.display = 'none'; return; }
      const [x, y] = tile(e), o = x >= 0 && y >= 0 && x < W && y < H ? owner[y * W + x] : 255;
      if (o > 0 && o < 255 && pm[o]) { c.textContent = infoLine(o); c.style.left = e.clientX + 14 + 'px'; c.style.top = e.clientY + 14 + 'px'; c.style.display = 'block'; } else c.style.display = 'none';
    };
    onmouseup = e => {
      if (!drag) return; drag = null; if (moved > 6 || !ws || !owner || e.target !== cv) return;
      const [x, y] = tile(e);
      if (e.button === 2) menu(e, x, y);
      else if (e.button === 0) {
        if (!alive()) send({ t: 'spawn', x, y });
        else if (gameState === 'playing') sendExpedition('atk', x, y);
      }
    };
    cv.oncontextmenu = e => e.preventDefault();
    onkeydown = e => { if (e.key === 'Escape') $('cm').style.display = 'none'; };
    cv.onwheel = e => {
      const f = e.deltaY < 0 ? 1.15 : 1 / 1.15, z = Math.min(30, Math.max(1, zoom * f));
      ox = e.clientX - (e.clientX - ox) * z / zoom; oy = e.clientY - (e.clientY - oy) * z / zoom; zoom = z;
    };
    (function loop() {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b1a2b'; ctx.fillRect(0, 0, cv.width, cv.height);
      if (off) {
        if (dirty) { octx.putImageData(img, 0, 0); dirty = false; }
        ctx.imageSmoothingEnabled = false; ctx.setTransform(zoom, 0, 0, zoom, ox, oy); ctx.drawImage(off, 0, 0);
        const buildingSize = Math.max(.8, 2 / zoom);
        for (const [i, type] of structureList) {
          const x = i % W, y = (i / W) | 0;
          ctx.fillStyle = type === 1 ? '#fbbf24' : type === 2 ? '#22d3ee' : type === 3 ? '#60a5fa' : '#f87171';
          ctx.fillRect(x - buildingSize / 2, y - buildingSize / 2, buildingSize, buildingSize);
          if (type > 1) {
            ctx.fillStyle = '#475569';
            ctx.fillRect(x + buildingSize * .12, y - buildingSize * .7, buildingSize * .24, buildingSize * .38);
          }
        }
        for (const b of boats) { ctx.fillStyle = '#fff'; ctx.fillRect(b[0] - 1.5, b[1] - 1.5, 3, 3); ctx.fillStyle = `rgb(${color(b[2], 0)})`; ctx.fillRect(b[0] - 1, b[1] - 1, 2, 2); }
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
