<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="utf-8">
  <title>Territori</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1a2b;
      font: 13px system-ui, sans-serif;
      color: #fff
    }

    canvas {
      display: block
    }

    #menu {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
      background: #0b1a2bee
    }

    input,
    button,
    select {
      padding: 7px 11px;
      font-size: 14px;
      border-radius: 6px;
      border: 0
    }

    select {
      color: #111
    }

    button {
      background: #3b82f6;
      color: #fff;
      cursor: pointer
    }

    .h {
      position: fixed;
      background: #000b;
      padding: 6px 10px;
      border-radius: 6px
    }

    #top {
      left: 8px;
      top: 8px
    }

    #rank {
      right: 8px;
      top: 8px;
      max-height: 60vh;
      overflow: auto;
      font-size: 12px
    }

    .rank-hidden #rank {
      display: none
    }

    .economic #rank {
      left: 8px;
      right: auto;
      top: auto;
      bottom: 8px;
      max-height: 35vh
    }

    .economic #rank div {
      grid-template-columns: 12px 72px 40px 38px 35px 52px
    }

    #rank div {
      display: grid;
      grid-template-columns: 12px 90px 52px 42px 44px;
      gap: 4px;
      white-space: nowrap
    }

    #toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: #000c; padding: 8px 14px; border-radius: 8px; display: none; z-index: 6 }

    #bot {
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      text-align: center;
      display: none
    }

    #actions {
      position: fixed;
      left: 8px;
      top: 48px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 16px);
      background: #000b;
      padding: 6px 8px;
      border-radius: 6px
    }

    #stance-toolbar {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 16px);
      padding: 6px 8px;
      border: 1px solid #ffffff24;
      border-radius: 10px;
      background: #000c;
      box-shadow: 0 8px 24px #0006;
      z-index: 4
    }

    #stance-btns {
      display: flex;
      gap: 6px
    }

    #stance-btns button {
      min-width: 108px;
      min-height: 44px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600
    }

    #stance-toolbar.collapsed .stance-label,
    #stance-toolbar.collapsed #stance-btns {
      display: none
    }

    #stance-toggle {
      min-width: 34px;
      padding: 6px 10px;
      background: #2a3b55;
      font-size: 18px
    }

    @media (max-width: 600px) {
      #stance-btns button {
        min-width: 0;
        padding: 8px 10px;
        font-size: 13px
      }

      #stance-toolbar:not(.collapsed) .stance-label {
        display: none
      }
    }

    #econ-panel {
      position: fixed;
      display: none;
      right: 8px;
      top: 84px;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 100px);
      box-sizing: border-box;
      overflow: auto;
      padding: 12px;
      border: 1px solid #ffffff24;
      border-radius: 10px;
      background: #101c2eef;
      box-shadow: 0 12px 40px #0008;
      z-index: 3
    }

    #econ-panel.minimized {
      width: min(240px, calc(100vw - 24px));
      overflow: hidden
    }

    #econ-panel.minimized #econ-content {
      display: none
    }

    #econ-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      cursor: move;
      touch-action: none;
      user-select: none
    }

    #econ-panel h2,
    #econ-panel h3 {
      margin: 0 0 8px
    }

    #econ-panel h2 {
      font-size: 17px
    }

    #econ-panel h3 {
      font-size: 13px;
      color: #bfdbfe
    }

    .econ-title {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .econ-info {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border: 1px solid #93c5fd;
      border-radius: 50%;
      color: #bfdbfe;
      font: 10px/1 system-ui, sans-serif;
      cursor: help
    }

    #econ-toggle {
      flex: 0 0 auto;
      padding: 3px 8px;
      background: #2a3b55;
      font-size: 16px;
      line-height: 1.2;
      cursor: pointer
    }

    #econ-summary,
    #econ-workers,
    #econ-production {
      color: #b6c4d6;
      font-size: 11px
    }

    .econ-section {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ffffff24
    }

    .econ-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px
    }

    .econ-metric {
      display: grid;
      gap: 2px;
      padding: 6px;
      border-radius: 6px;
      background: #ffffff10
    }

    .econ-metric span {
      color: #b6c4d6;
      font-size: 10px
    }

    .econ-metric strong {
      font-size: 14px
    }

    .econ-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .econ-row input[type="range"] {
      width: 130px;
      padding: 0
    }

    .econ-row input[type="number"],
    #expedition-mode,
    #expedition-amount {
      width: 100px;
      padding: 5px 7px
    }

    #econ-requests,
    #econ-peace {
      display: grid;
      gap: 6px;
      max-height: 220px;
      overflow: auto
    }

    .ship-request,
    .ship-offer {
      display: grid;
      gap: 5px;
      padding: 6px;
      border-radius: 6px;
      background: #ffffff10
    }

    .ship-offer {
      grid-template-columns: 1fr auto auto;
      align-items: center;
      margin-top: 4px
    }

    .ship-request > .econ-row,
    .ship-request > input,
    .ship-request > button {
      min-width: 0
    }

    #econ-requests input {
      width: 76px;
      padding: 5px 6px
    }

    #econ-requests button,
    #econ-peace button {
      padding: 5px 7px;
      font-size: 12px
    }

    .econ-section button {
      padding: 5px 7px;
      font-size: 12px
    }

    #econ-panel .muted {
      color: #b6c4d6;
      font-size: 11px
    }

    @media (max-width: 700px) {
      #econ-panel {
        max-height: 48vh
      }

      .economic #rank {
        display: none
      }
    }

    #cm {
      position: fixed;
      display: none;
      background: #111e;
      border-radius: 8px;
      padding: 6px;
      min-width: 170px;
      z-index: 5
    }

    #cm b {
      display: block;
      margin-bottom: 4px
    }

    #cm button {
      display: block;
      width: 100%;
      margin-top: 3px;
      text-align: left;
      background: #2a3b55
    }

    #card {
      position: fixed;
      display: none;
      pointer-events: none;
      background: #000d;
      padding: 6px 9px;
      border-radius: 6px;
      z-index: 4
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="menu">
    <h1>Territori</h1>
    <input id="name" placeholder="El teu nom" maxlength="16">
    <input id="room" placeholder="Codi de sala (buit = crear-ne una)" maxlength="4" style="text-transform:uppercase">
    <select id="mode">
      <option value="classic">Mode clàssic</option>
      <option value="economic">Mode econòmic: ciutats i fàbriques</option>
    </select>
    <select id="territory">
      <option value="random">Territori aleatori</option>
      <option value="americas">Amèriques</option>
      <option value="europe_africa">Europa i Àfrica</option>
      <option value="asia_pacific">Àsia i Oceania</option>
      <option value="world">Món sencer</option>
    </select>
    <details id="hub-cfg" style="display:none;background:#ffffff12;padding:8px 12px;border-radius:6px">
      <summary style="cursor:pointer">⚙️ Postures (% soldats)</summary>
      <div style="display:grid;grid-template-columns:auto 65px;gap:6px;margin-top:8px;align-items:center">
        <label for="cfg-eco">Economia</label><input id="cfg-eco" type="number" min="0" max="100" value="20">
        <label for="cfg-bal">Equilibrat</label><input id="cfg-bal" type="number" min="0" max="100" value="45">
        <label for="cfg-mob">Mobilització</label><input id="cfg-mob" type="number" min="0" max="100" value="75">
      </div>
    </details>
    <button id="go">Entrar</button>
  </div>
  <div class="h" id="top"></div>
  <div class="h" id="rank"></div>
  <div id="actions">
    <span id="gamestate"></span>
    <span id="roomcode"></span>
    <span id="pct-wrap">
      <label for="pct">Enviar a l’atac</label>
      <input id="pct" type="range" min="1" max="100" value="35">
      <span id="pl">35%</span>
    </span>
    <button id="rank-toggle" type="button" aria-controls="rank" aria-expanded="true">Amagar classificació</button>
    <button id="start" style="display:none">Començar Partida</button>
    <button id="restart" style="display:none">Reiniciar Partida</button>
  </div>
  <div id="stance-toolbar" role="group" aria-label="Postures d’exèrcit" style="display:none">
    <span class="stance-label">Postures</span>
    <div id="stance-btns">
      <button type="button" data-stance="eco">Economia</button>
      <button type="button" data-stance="bal">Equilibrat</button>
      <button type="button" data-stance="mob">Mobilització</button>
    </div>
    <button id="stance-toggle" type="button" aria-expanded="true" aria-label="Reduir barra" title="Reduir barra">−</button>
  </div>
  <aside id="econ-panel" aria-label="Gestió econòmica">
    <header id="econ-header">
      <div>
        <h2 class="econ-title">Economia <span class="econ-info" tabindex="0" title="Arrossega aquesta capçalera per moure el panell. Les icones d’informació expliquen cada opció." aria-label="Ajuda del panell">i</span></h2>
        <div id="econ-summary"></div>
      </div>
      <button id="econ-toggle" type="button" aria-expanded="true" aria-label="Minimitzar panell" title="Minimitzar">−</button>
    </header>
    <div id="econ-content">
    <section class="econ-section">
      <h3 class="econ-title">Població i exèrcit <span class="econ-info" tabindex="0" title="Els habitants civils generen ingressos i fabriquen vaixells. El percentatge militar determina la capacitat de soldats." aria-label="Informació de població i exèrcit">i</span></h3>
      <div id="econ-workers" class="muted" title="La densitat defensiva és el nombre de soldats per territori: com més baixa, més fàcil és que t’envaeixin."></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Economia i flota <span id="inventory-info" class="econ-info" tabindex="0" aria-label="Informació d’inventari">i</span></h3>
      <div id="econ-inventory" class="econ-metrics"></div>
      <div id="econ-production" class="muted"></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Expedicions <span class="econ-info" tabindex="0" title="Fes clic a terra lliure per expandir o a un enemic per atacar-ne la frontera. Les tropes segueixen una ruta; cal permís per travessar altres fronteres i un vaixell per cada 100 soldats a cada tram marítim." aria-label="Informació d’expedicions">i</span></h3>
      <div class="econ-row">
        <label for="expedition-mode">Quantitat</label>
        <select id="expedition-mode">
          <option value="percent">Percentatge de l’exèrcit</option>
          <option value="exact">Nombre exacte</option>
        </select>
      </div>
      <div class="econ-row" id="expedition-percent-row">
        <label for="expedition-percent">Percentatge</label>
        <input id="expedition-percent" type="range" min="1" max="100" value="35">
        <span id="expedition-percent-label">35%</span>
      </div>
      <div class="econ-row" id="expedition-exact-row" style="display:none">
        <label for="expedition-amount">Soldats</label>
        <input id="expedition-amount" type="number" min="5" step="1" value="100">
      </div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Demanar vaixells <span class="econ-info" tabindex="0" title="Publica una demanda amb quantitat i preu màxim en euros per vaixell. Jugadors i bots poden fer ofertes; tu decideixes quina acceptes." aria-label="Informació de demandes">i</span></h3>
      <div class="econ-row">
        <input id="ship-request-quantity" type="number" min="1" step="1" value="1" aria-label="Nombre de vaixells que demanes">
        <input id="ship-request-price" type="number" min="1" step="1" value="1500" aria-label="Preu màxim en euros per vaixell">
        <button id="ship-request-create">Demanar</button>
      </div>
      <div class="econ-row">
        <span>Vaixells</span>
        <span>Màx. €/unitat</span>
      </div>
      <div id="econ-requests"></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Pau i diplomàcia <span class="econ-info" tabindex="0" title="Si t’estan atacant, proposa un pagament en euros. Si l’atacant accepta, es cancel·la l’atac i comença un alto el foc de 120 segons." aria-label="Informació de diplomàcia">i</span></h3>
      <div id="econ-peace"></div>
    </section>
    </div>
  </aside>
  <div class="h" id="bot">
    <div id="hint"></div>
    <div id="code"></div>
  </div>
  <div id="toast"></div>
  <div id="cm"></div>
  <div id="card"></div>
  <script>
    const $ = id => document.getElementById(id);
    let ws, W, H, NB, me, owner, structures, structureList = [], gameMode = 'classic', off, octx, img, land = 1, zoom = 3, ox = 0, oy = 0, dirty = false, pm = {}, economy = {}, shipRequests = [], peaceOffers = [], marches = [], threats = {}, ceasefires = [], boats = [], gameState = 'lobby', host = 0, winner = 0, allies = new Set(), stances = { eco: 20, bal: 45, mob: 75 };
    const cv = $('c'), ctx = cv.getContext('2d');
    let missiles = [], blasts = [], nukeCd = {};
    function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4000); }
    function onNuke(m) { const n = performance.now(); toast(m.intercepted ? 'Míssil interceptat!' : 'Impacte nuclear!'); blasts.push({ x: m.x, y: m.y, r: m.r || 6, t0: n, until: n + (m.ms || 1500), hit: !m.intercepted }); }
    function resize() { cv.width = innerWidth; cv.height = innerHeight } onresize = resize; resize();
    function hsl(h) { const s = .6, l = .5, a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))) }; return [f(0), f(8), f(4)] }
    function color(id, i) { if (id === 255) return [14, 40, 72]; if (!id) return (i / W | 0) < H * .1 ? [205, 215, 222] : [62, 98, 66]; if (id <= NB) return hsl(id * 47 % 360); return id === me ? [59, 130, 246] : [34, 211, 238] }
    function paint(i) { const c = color(owner[i], i), d = img.data; d[4 * i] = c[0]; d[4 * i + 1] = c[1]; d[4 * i + 2] = c[2]; d[4 * i + 3] = 255; }
    $('name').value = localStorage.nom || '';
    const toggleHubCfg = () => {
      const hasRoom = !!$('room').value;
      $('mode').disabled = hasRoom;
      $('territory').disabled = hasRoom;
      $('hub-cfg').style.display = !hasRoom && $('mode').value === 'economic' ? 'block' : 'none';
    };
    $('room').oninput = toggleHubCfg;
    $('mode').onchange = toggleHubCfg;
    $('go').onclick = () => {
      localStorage.nom = $('name').value;
      ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host);
      ws.onopen = () => ws.send(JSON.stringify({
        t: 'join',
        name: $('name').value || 'Jugador',
        room: $('room').value,
        mode: $('mode').value,
        territory: $('territory').value,
        stances: { eco: +$('cfg-eco').value, bal: +$('cfg-bal').value, mob: +$('cfg-mob').value }
      }));
      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.t === 'err') {
          if (!(gameMode === 'classic' && m.m === 'Una expedicio necessita almenys 5 soldats.')) alert(m.m);
        }
        else if (m.t === 'init') {
          W = m.w; H = m.h; NB = m.nb; me = m.me; land = m.land; gameState = m.state; host = m.host; gameMode = m.mode;
          if (m.stances) stances = m.stances;
          owner = Uint8Array.from(atob(m.owner), c => c.charCodeAt(0));
          structures = Uint8Array.from(atob(m.structures), c => c.charCodeAt(0)); rebuildStructureList();
          off = document.createElement('canvas'); off.width = W; off.height = H; octx = off.getContext('2d'); img = octx.createImageData(W, H);
          for (let i = 0; i < W * H; i++)paint(i); dirty = true;
          zoom = Math.min(innerWidth / W, innerHeight / H) * .95; ox = (innerWidth - W * zoom) / 2; oy = (innerHeight - H * zoom) / 2;
          $('menu').style.display = 'none';
          $('roomcode').textContent = 'Codi de sala: ' + m.code;
          $('code').textContent = 'Sala: ' + m.code + ' (passa-li el codi al teu amic)';
          $('territory').value = m.territory;
          updateControls();
        }
        else if (m.t === 'reset') { owner = Uint8Array.from(atob(m.owner), c => c.charCodeAt(0)); structures = Uint8Array.from(atob(m.structures), c => c.charCodeAt(0)); rebuildStructureList(); missiles = []; blasts = []; boats = []; marches = []; shipRequests = []; peaceOffers = []; ceasefires = []; threats = {}; for (let i = 0; i < W * H; i++) paint(i); dirty = true; gameState = 'lobby'; winner = 0; allies.clear(); updateControls(); }
        else if (m.t === 'd') { for (let k = 0; k < m.c.length; k += 2) { owner[m.c[k]] = m.c[k + 1]; paint(m.c[k]); } dirty = true; }
        else if (m.t === 'building') {
          structures[m.i] = m.type;
          structureList = structureList.filter(([i]) => i !== m.i);
          if (m.type) structureList.push([m.i, m.type]);
        }
        else if (m.t === 'b') boats = m.b;
        else if (m.t === 'mi') missiles = m.m;
        else if (m.t === 'nuke') onNuke(m);
        else if (m.t === 'toast') toast(m.m);
        else if (m.t === 's') {
          gameState = m.state; host = m.host; winner = m.winner; gameMode = m.mode;
          economy = Object.fromEntries((m.economy || []).map(p => [p.id, p]));
          shipRequests = m.shipRequests || [];
          peaceOffers = m.peaceOffers || [];
          marches = m.marches || [];
          threats = Object.fromEntries(m.threats || []); nukeCd = Object.fromEntries(m.nuke || []);
          ceasefires = m.ceasefires || [];
          allies = new Set(m.allies.map(x => x.slice().sort((a, b) => a - b).join(':')));
          stats(m.p);
          updateControls(); updateEconomicPanel();
        }
        else if (m.t === 'peaceOffer') {
          const accept = confirm(`${m.name} ofereix ${m.amount.toLocaleString('ca-ES')} € per aturar l’atac durant 120 segons. Acceptes?`);
          send({ t: 'peaceReply', offer: m.id, accept });
        }
        else if (m.t === 'peaceResult') alert(m.accepted
          ? `Pau acceptada amb ${m.name}. Import: ${m.amount.toLocaleString('ca-ES')} €.`
          : `${m.name} ha rebutjat la proposta de pau.`);
        else if (m.t === 'pactRequest' && confirm(`${m.name} et proposa un pacte. Vols acceptar-lo?`)) send({ t: 'pactReply', from: m.from, accept: true });
        else if (m.t === 'pactRequest') send({ t: 'pactReply', from: m.from, accept: false });
      };
    };
    const alive = () => pm[me] && pm[me][4];
    function rebuildStructureList() {
      structureList = [];
      for (let i = 0; i < structures.length; i++)if (structures[i]) structureList.push([i, structures[i]]);
    }
    function updateControls() {
      $('start').style.display = host === me && gameState === 'lobby' ? 'inline-block' : 'none';
      $('restart').style.display = host === me && gameState === 'over' ? 'inline-block' : 'none';
      $('pct-wrap').style.display = gameMode === 'economic' ? 'none' : 'inline';
      if (gameMode === 'classic') $('pct-wrap').style.display = 'none';
      $('econ-panel').style.display = gameMode === 'economic' ? 'block' : 'none';
      $('stance-toolbar').style.display = gameMode === 'economic' && gameState === 'playing' ? 'flex' : 'none';
      document.querySelectorAll('#stance-btns button').forEach(button => { button.disabled = !alive(); });
      document.body.classList.toggle('economic', gameMode === 'economic');
      $('mode').disabled = !!$('room').value;
      $('territory').disabled = !!$('room').value;
      $('gamestate').textContent = gameState === 'lobby' ? 'Sala d’espera' : gameState === 'playing' ? 'Partida en marxa' : winner ? `${pm[winner]?.[1] || 'Jugador'} ha guanyat` : 'Partida acabada';
    }
    function stats(p) {
      pm = {}; p.forEach(x => pm[x[0]] = x); const q = pm[me];
      $('top').textContent = q && q[4] ? gameMode === 'economic'
        ? `Soldats: ${q[3]} · Habitants: ${q[10]} · Euros: ${Math.floor(q[6]).toLocaleString('ca-ES')} · Ciutats: ${q[8]}`
        : `Tropes: ${q[3]} · Interès: ${(q[5] * 100).toFixed(1)}% · Terra: ${(q[2] / land * 100).toFixed(1)}%`
        : 'Encara no has aparegut';
      $('hint').textContent = q && q[4]
        ? gameMode === 'economic'
          ? 'Fes clic a terra lliure per expandir o a un enemic per atacar la frontera · clic dret per construir'
          : 'Clic esquerre: atacar · clic dret: pactes i donacions · roda: zoom · arrossega: moure'
        : 'Fes clic esquerre a terra lliure, lluny d\'altres, per aparèixer';
      const R = $('rank'); R.textContent = '';
      const row = (a) => { const d = document.createElement('div'); a.forEach((t, i) => { const s = document.createElement('span'); if (i === 0) { const c = color(t, 0); s.style.cssText = `background:rgb(${c});height:10px;margin-top:3px`; } else s.textContent = t; d.appendChild(s); }); R.appendChild(d); return d; };
      const headings = gameMode === 'economic'
        ? [0, 'Jugador', 'Tropes', 'Pobl.', 'Terra', 'S/Terra']
        : [0, 'Jugador', 'Tropes', 'Int.', 'Terra'];
      const header = row(headings);
      header.style.opacity = .6;
      if (gameMode === 'economic') header.lastElementChild.title = 'Soldats per píxel de territori; menys = més fàcil d’envair.';
      p.filter(x => x[4]).sort((a, b) => b[2] - a[2]).forEach(x => {
        const detail = gameMode === 'economic' ? Math.floor(x[10]) : (x[5] * 100).toFixed(1) + '%';
        const values = [x[0], x[1], x[3], detail, (x[2] / land * 100).toFixed(1) + '%'];
        if (gameMode === 'economic') values.push((x[3] / Math.max(x[2], 1)).toFixed(1));
        const d = row(values);
        if (gameMode === 'economic') d.lastElementChild.title = 'Soldats per píxel de territori; menys = més fàcil d’envair.';
        if (x[0] === me) d.style.fontWeight = 'bold';
      });
    }
    function updateEconomicPanel() {
      if (gameMode !== 'economic' || !economy[me]) return;
      const q = pm[me], e = economy[me];
      updateStanceBtns(q[7]);
      $('econ-summary').textContent = `${Math.floor(q[10])} habitants · ${Math.floor(e.money).toLocaleString('ca-ES')} €`;
      const defenseDensity = q[3] / Math.max(q[2], 1);
      $('econ-workers').textContent = `${Math.floor(q[12])} civils treballen · ${Math.floor(q[3])} soldats · ${defenseDensity.toFixed(1)} soldats/territori`;
      const inventory = $('econ-inventory');

      for (const [label, value, rate] of [
        ['Diners', `${Math.floor(e.money).toLocaleString('ca-ES')} €`, `+${e.incomeRate.toFixed(1)} €/s`],
        ['Vaixells', e.ships, `+${e.shipRate.toFixed(2)}/s`],

      ]) {
        const metric = document.createElement('div');

        const name = document.createElement('span');
        name.textContent = label;
        const amount = document.createElement('strong');
        amount.textContent = value;
        const production = document.createElement('span');
        production.textContent = rate;
        metric.append(name, amount, production);
        inventory.appendChild(metric);
      }
      $('econ-production').textContent = `Reclutament +${e.recruitmentRate.toFixed(1)}/s · Capacitat ${Math.floor(e.armyCapacity)} · Eficàcia ${e.combatEfficiency.toFixed(1)}x`;
      $('inventory-info').title = `Ingressos totals: ${e.incomeRate.toFixed(1)} €/s, incloent ${e.staffedBanks} bancs actius de ${e.banks}. Cada banc requereix 100 civils i genera 25 €/s. Cada fàbrica d’armes augmenta un 10% l’eficàcia d’atac i defensa (màxim +100%). Drassanes: ${e.shipyards} · fàbriques d’armes: ${e.armsFactories}.`;
      renderShipRequests();
      renderPeace();
    }
    function updateStanceBtns(alloc) {
      document.querySelectorAll('#stance-btns button').forEach(button => {
        const active = stances[button.dataset.stance] === alloc || (!alive() && button.dataset.stance === 'bal');
        button.style.background = active ? '#22c55e' : '#2a3b55';
        button.title = `${stances[button.dataset.stance]}% soldats / ${100 - stances[button.dataset.stance]}% civils`;
      });
    }
    function renderShipRequests() {
      const root = $('econ-requests'); root.textContent = '';
      const inventory = economy[me];
      for (const request of shipRequests) {
        const card = document.createElement('div'); card.className = 'ship-request';
        const title = document.createElement('div');
        title.textContent = `${request.name}: ${request.quantity} vaixell(s) · màx. ${request.maxPrice.toLocaleString('ca-ES')} €/u.`;
        card.appendChild(title);
        const existingOffer = request.offers.find(offer => offer.seller === me);
        if (request.buyer === me) {
          const cancel = document.createElement('button');
          cancel.textContent = 'Retirar demanda';
          cancel.onclick = () => send({ t: 'shipRequestCancel', request: request.id });
          card.appendChild(cancel);
        } else if (existingOffer) {
          const submitted = document.createElement('div');
          submitted.textContent = 'Ja has enviat una oferta per aquesta demanda.';
          card.appendChild(submitted);
        } else {
          const quantity = document.createElement('input');
          quantity.type = 'number'; quantity.min = '1'; quantity.max = request.quantity;
          quantity.value = String(Math.min(request.quantity, inventory ? inventory.ships : 0));
          quantity.setAttribute('aria-label', 'Vaixells que ofereixes');
          const price = document.createElement('input');
          price.type = 'number'; price.min = '1'; price.max = request.maxPrice;
          price.value = String(Math.min(request.maxPrice, 1500));
          price.setAttribute('aria-label', 'Preu per vaixell en euros');
          const offer = document.createElement('button');
          offer.textContent = 'Fer oferta';
          const updateOfferButton = () => {
            const amount = Number(quantity.value), unitPrice = Number(price.value);
            offer.disabled = !Number.isSafeInteger(amount) || amount < 1 || amount > request.quantity ||
              !Number.isSafeInteger(unitPrice) || unitPrice < 1 || unitPrice > request.maxPrice ||
              !inventory || amount > inventory.ships;
          };
          quantity.oninput = updateOfferButton;
          price.oninput = updateOfferButton;
          updateOfferButton();
          offer.onclick = () => send({ t: 'shipOffer', request: request.id, quantity: Number(quantity.value), price: Number(price.value) });
          card.append(quantity, price, offer);
        }
        for (const offer of request.offers) {
          const row = document.createElement('div'); row.className = 'ship-offer';
          const label = document.createElement('span');
          label.textContent = `${offer.name}${offer.bot ? ' · bot' : ''}: ${offer.quantity} a ${offer.price.toLocaleString('ca-ES')} €/u.`;
          row.appendChild(label);
          if (request.buyer === me) {
            const quantity = document.createElement('input');
            quantity.type = 'number'; quantity.min = '1'; quantity.max = offer.quantity;
            quantity.value = String(Math.min(offer.quantity, request.quantity));
            quantity.setAttribute('aria-label', 'Vaixells a acceptar');
            const accept = document.createElement('button');
            accept.textContent = 'Acceptar';
            const updateAcceptButton = () => {
              const amount = Number(quantity.value), total = amount * offer.price;
              accept.disabled = !Number.isSafeInteger(amount) || amount < 1 || amount > offer.quantity ||
                amount > request.quantity || !inventory || !Number.isSafeInteger(total) || total > inventory.money;
            };
            quantity.oninput = updateAcceptButton;
            updateAcceptButton();
            accept.onclick = () => send({ t: 'shipAccept', offer: offer.id, quantity: Number(quantity.value) });
            row.append(quantity, accept);
          } else if (offer.seller === me) {
            const cancel = document.createElement('button');
            cancel.textContent = 'Retirar oferta';
            cancel.onclick = () => send({ t: 'shipOfferCancel', offer: offer.id });
            row.appendChild(cancel);

          card.appendChild(row);

    }
    function renderPeace() {
      const root = $('econ-peace'); root.textContent = '';
      for (const offer of peaceOffers.filter(item => item.to === me)) {
        const row = document.createElement('div'); row.className = 'ship-offer';
        const label = document.createElement('span');
        label.textContent = `${offer.name} ofereix ${offer.amount.toLocaleString('ca-ES')} € per la pau`;
        const accept = document.createElement('button'); accept.textContent = 'Acceptar';
        accept.onclick = () => send({ t: 'peaceReply', offer: offer.id, accept: true });
        const decline = document.createElement('button'); decline.textContent = 'Rebutjar';
        decline.onclick = () => send({ t: 'peaceReply', offer: offer.id, accept: false });
        row.append(label, accept, decline); root.appendChild(row);
      }
      for (const [a, b, ticks] of ceasefires) {
        if (a !== me && b !== me) continue;
        const other = pm[a === me ? b : a];
        const label = document.createElement('div');
        label.textContent = `Alto el foc amb ${other ? other[1] : 'jugador'} · ${Math.ceil(ticks * .2)} s`;
        root.appendChild(label);
      }
      if (!root.childElementCount) root.textContent = 'Cap tracte de pau actiu.';
    }
    const econPanel = $('econ-panel'), econHeader = $('econ-header');
    $('econ-toggle').onclick = () => {
      const minimized = econPanel.classList.toggle('minimized');
      $('econ-toggle').textContent = minimized ? '+' : '−';
      $('econ-toggle').title = minimized ? 'Ampliar' : 'Minimitzar';
      $('econ-toggle').setAttribute('aria-label', minimized ? 'Ampliar panell' : 'Minimitzar panell');
      $('econ-toggle').setAttribute('aria-expanded', String(!minimized));
    };
    let panelDrag = null;
    econHeader.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('button,.econ-info')) return;
      const rect = econPanel.getBoundingClientRect();
      panelDrag = { x: e.clientX, y: e.clientY, left: rect.left, top: rect.top };
      econHeader.setPointerCapture(e.pointerId);
    });
    econHeader.addEventListener('pointermove', e => {
      if (!panelDrag) return;
      const rect = econPanel.getBoundingClientRect();
      const left = Math.max(8, Math.min(innerWidth - rect.width - 8, panelDrag.left + e.clientX - panelDrag.x));
      const top = Math.max(8, Math.min(innerHeight - rect.height - 8, panelDrag.top + e.clientY - panelDrag.y));
      econPanel.style.left = `${left}px`;
      econPanel.style.right = 'auto';
      econPanel.style.top = `${top}px`;
    });
    const stopPanelDrag = () => { panelDrag = null; };
    econHeader.addEventListener('pointerup', stopPanelDrag);
    econHeader.addEventListener('pointercancel', stopPanelDrag);
    window.addEventListener('resize', () => {
      if (!econPanel.style.left) return;
      const rect = econPanel.getBoundingClientRect();
      econPanel.style.left = `${Math.max(8, Math.min(innerWidth - rect.width - 8, rect.left))}px`;
      econPanel.style.top = `${Math.max(8, Math.min(innerHeight - rect.height - 8, rect.top))}px`;
    });
    $('start').onclick = () => send({ t: 'start' });
    $('restart').onclick = () => send({ t: 'restart' });
    $('rank-toggle').onclick = () => {
      const hidden = document.body.classList.toggle('rank-hidden');
      $('rank-toggle').textContent = hidden ? 'Mostrar classificació' : 'Amagar classificació';
      $('rank-toggle').setAttribute('aria-expanded', String(!hidden));
    };
    $('stance-toggle').onclick = () => {
      const collapsed = $('stance-toolbar').classList.toggle('collapsed');
      $('stance-toggle').textContent = collapsed ? '+' : '−';
      $('stance-toggle').title = collapsed ? 'Ampliar barra' : 'Reduir barra';
      $('stance-toggle').setAttribute('aria-label', $('stance-toggle').title);
      $('stance-toggle').setAttribute('aria-expanded', String(!collapsed));
    };
    $('pct').oninput = () => $('pl').textContent = $('pct').value + '%';
    $('stance-btns').onclick = e => {
      const stance = e.target.dataset.stance;
      if (stance) send({ t: 'allocate', stance });
    };
    $('expedition-mode').onchange = () => {
      const exact = $('expedition-mode').value === 'exact';
      $('expedition-percent-row').style.display = exact ? 'none' : 'flex';
      $('expedition-exact-row').style.display = exact ? 'flex' : 'none';
    };
    $('expedition-percent').oninput = () => $('expedition-percent-label').textContent = `${$('expedition-percent').value}%`;
    $('ship-request-create').onclick = () => send({
      t: 'shipRequest',
      quantity: Number($('ship-request-quantity').value),
      maxPrice: Number($('ship-request-price').value)
    });
    const tile = e => [Math.floor((e.clientX - ox) / zoom), Math.floor((e.clientY - oy) / zoom)];
    const send = o => ws.send(JSON.stringify(o));
    const pct = () => gameMode === 'economic' ? Number($('expedition-percent').value) / 100 : Number($('pct').value) / 100;
    function sendExpedition(t, x, y, betray = false) {
      const selection = gameMode === 'economic'
        ? $('expedition-mode').value === 'exact'
          ? { expeditionMode: 'exact', amount: Number($('expedition-amount').value) }
          : { expeditionMode: 'percent' }
        : {};
      send({ t, x, y, pct: pct(), betray, ...selection });
    }
    function infoLine(id) {
      const p = pm[id];
      return p ? gameMode === 'economic'
        ? `${p[1]} — Exèrcit ${p[3]} · Habitants ${p[10]}`
        : `${p[1]} — Tropes ${p[3]} · Int. ${(p[5] * 100).toFixed(1)}% · Terra ${(p[2] / land * 100).toFixed(1)}%`
        : '';
    }
    function menu(e, x, y) {
      const cm = $('cm'); cm.textContent = '';
      const o = x >= 0 && y >= 0 && x < W && y < H ? owner[y * W + x] : 255;
      const add = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { cm.style.display = 'none'; f(); }; cm.appendChild(b); };
      const h = document.createElement('b'); h.textContent = o === 255 ? 'Mar' : o === 0 ? 'Terra lliure' : o === me ? 'El teu territori' : infoLine(o); cm.appendChild(h);
      if (alive()) {
        const isAlly = o > NB && allies.has([me, o].sort((a, b) => a - b).join(':'));
        if (gameMode === 'economic' && gameState === 'playing' && o === me && !structures[y * W + x]) {
          const q = pm[me];
          if (q[6] >= 2500 && (!q[8] || q[10] >= q[8] * 1000)) add('Construir ciutat (2.500 €)', () => send({ t: 'build', i: y * W + x, building: 'city' }));
          { const ec = economy[me] || {};
            if (q[8] > 0 && q[6] >= 6000 && (ec.silos || 0) < 3) add('Construir sitja de míssils (6.000 €)', () => send({ t: 'build', i: y * W + x, building: 'silo' }));
            if (q[8] > 0 && q[6] >= 5000 && (ec.radars || 0) < 3) add('Construir radar antimíssils (5.000 €)', () => send({ t: 'build', i: y * W + x, building: 'radar' }));
            if (q[8] > 0 && q[6] >= 3000 && (ec.banks || 0) < 5) add('Construir banc (3.000 €)', () => send({ t: 'build', i: y * W + x, building: 'bank' })); }
          if (q[8] > 0 && q[9] < 10) {
            if (q[6] >= 4000) add('Construir drassana (4.000 €)', () => send({ t: 'build', i: y * W + x, building: 'shipyard' }));
            if (q[6] >= 3500) add('Construir fàbrica d’armes (3.500 €)', () => send({ t: 'build', i: y * W + x, building: 'armsFactory' }));
          }
        }
        if (gameState === 'playing' && o > NB && o !== me) {
          [10, 25, 50].forEach(p => add(`Donar ${p}% de tropes`, () => send({ t: 'give', to: o, pct: p / 100 })));
          if (!isAlly) add('Proposar pacte', () => send({ t: 'pact', to: o }));
        }
        if (gameMode === 'economic' && gameState === 'playing' && o !== me && o > 0 && o !== 255 &&
            (threats[me] || []).includes(o)) {
          add('Oferir pau pagada', () => {
            const amount = Number(prompt(`Quants euros ofereixes per aturar l’atac de ${pm[o]?.[1] || 'aquest jugador'} durant 120 segons?`));
            if (Number.isSafeInteger(amount) && amount > 0) send({ t: 'peaceOffer', to: o, amount });
          });
        }
        if (gameState === 'playing' && o !== me && o !== 255) {
          const label = gameMode === 'economic' ? 'Enviar exèrcit' : 'Atacar';
          if (isAlly) add(`Trair pacte i ${label.toLowerCase()}`, () => sendExpedition('atk', x, y, true));
          else add(label, () => sendExpedition('atk', x, y));
        }
        if (gameState === 'playing' && o !== me) {
          const label = gameMode === 'economic' ? 'Enviar exèrcit per mar' : 'Enviar vaixell';
          if (isAlly) add(`Trair pacte i ${label.toLowerCase()}`, () => sendExpedition('boat', x, y, true));
          else add(label, () => sendExpedition('boat', x, y));
        }
        if (gameState === 'playing' && o > 0 && o !== 255 && o !== me) {
          const cd = nukeCd[me] || 0, ec = economy[me] || {};
          const dis = t => { const b = document.createElement('button'); b.textContent = t; b.disabled = true; cm.appendChild(b); };
          if (cd > 0) dis(`Bomba nuclear en recàrrega (${Math.ceil(cd / 5)} s)`);
          else if (gameMode === 'economic' && !ec.silos) dis('Bomba nuclear: cal un sitja de míssils');
          else add(`Llançar bomba nuclear (${gameMode === 'economic' ? '8.000 €' : '50% de tropes'})`, () => { if (confirm('Segur que vols llançar una bomba nuclear?')) send({ t: 'nuke', x, y }); });
        }
      } else if (o === 0) add('Aparèixer aquí', () => send({ t: 'spawn', x, y }));
      cm.style.left = Math.min(e.clientX, innerWidth - 190) + 'px'; cm.style.top = Math.min(e.clientY, innerHeight - 150) + 'px'; cm.style.display = 'block';
    }
    let drag = null, moved = 0;
    cv.onmousedown = e => { $('cm').style.display = 'none'; drag = { x: e.clientX, y: e.clientY }; moved = 0; };
    onmousemove = e => {
      if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); ox += dx; oy += dy; drag.x = e.clientX; drag.y = e.clientY; }
      const c = $('card'); if (!owner || e.target !== cv || drag) { c.style.display = 'none'; return; }
      const [x, y] = tile(e), o = x >= 0 && y >= 0 && x < W && y < H ? owner[y * W + x] : 255;
      if (o > 0 && o < 255 && pm[o]) { c.textContent = infoLine(o); c.style.left = e.clientX + 14 + 'px'; c.style.top = e.clientY + 14 + 'px'; c.style.display = 'block'; } else c.style.display = 'none';
    };
    onmouseup = e => {
      if (!drag) return; drag = null; if (moved > 6 || !ws || !owner || e.target !== cv) return;
      const [x, y] = tile(e);

        else if (gameState === 'playing') sendExpedition('atk', x, y);
      }
    };
    cv.oncontextmenu = e => e.preventDefault();
    onkeydown = e => { if (e.key === 'Escape') $('cm').style.display = 'none'; };
    cv.onwheel = e => {
      const f = e.deltaY < 0 ? 1.15 : 1 / 1.15, z = Math.min(30, Math.max(1, zoom * f));
      ox = e.clientX - (e.clientX - ox) * z / zoom; oy = e.clientY - (e.clientY - oy) * z / zoom; zoom = z;
    };
    (function loop() {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b1a2b'; ctx.fillRect(0, 0, cv.width, cv.height);
      if (off) {
        if (dirty) { octx.putImageData(img, 0, 0); dirty = false; }
        ctx.imageSmoothingEnabled = false; ctx.setTransform(zoom, 0, 0, zoom, ox, oy); ctx.drawImage(off, 0, 0);
        const buildingSize = Math.max(.8, 2 / zoom);
        for (const [i, type] of structureList) {
          const x = i % W, y = (i / W) | 0;
          ctx.fillStyle = type === 1 ? '#fbbf24' : type === 2 ? '#22d3ee' : type === 3 ? '#60a5fa' : type === 5 ? '#e879f9' : type === 6 ? '#4ade80' : type === 7 ? '#34d399' : '#f87171';
          ctx.fillRect(x - buildingSize / 2, y - buildingSize / 2, buildingSize, buildingSize);
          if (type > 1) {
            ctx.fillStyle = '#475569';
            ctx.fillRect(x + buildingSize * .12, y - buildingSize * .7, buildingSize * .24, buildingSize * .38);
          }
        }
        for (const b of boats) { ctx.fillStyle = '#fff'; ctx.fillRect(b[0] - 1.5, b[1] - 1.5, 3, 3); ctx.fillStyle = `rgb(${color(b[2], 0)})`; ctx.fillRect(b[0] - 1, b[1] - 1, 2, 2); }
        const now = performance.now(); blasts = blasts.filter(b => b.until > now);
        for (const b of blasts) {
          const age = now - b.t0;
          if (b.hit) {
            ctx.fillStyle = 'rgba(130,70,20,.4)';
            for (let dy = -b.r; dy <= b.r; dy++)for (let dx = -b.r; dx <= b.r; dx++) {
              if (dx * dx + dy * dy > b.r * b.r) continue;
              const x = b.x + dx, y = b.y + dy; if (x >= 0 && y >= 0 && x < W && y < H && owner[y * W + x] === 0) ctx.fillRect(x, y, 1, 1);
            }
          }
          if (age < 1200) { ctx.fillStyle = `rgba(255,${200 - age / 8 | 0},60,${1 - age / 1200})`; ctx.beginPath(); ctx.arc(b.x + .5, b.y + .5, b.r * (.4 + age / 1500), 0, 6.283); ctx.fill(); }
        }
        for (const m of missiles) {
          ctx.strokeStyle = 'rgba(255,60,60,.8)'; ctx.lineWidth = Math.max(.3, 1 / zoom); ctx.beginPath(); ctx.arc(m[3] + .5, m[4] + .5, 6, 0, 6.283); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(m[0], m[1], Math.max(1.5, 3 / zoom), 0, 6.283); ctx.fill();
        }
        for (const march of marches) {
          ctx.fillStyle = march[3] ? '#fbbf24' : `rgb(${color(march[2], 0)})`;
          ctx.beginPath(); ctx.arc(march[0], march[1], Math.max(1.5, 3 / zoom), 0, Math.PI * 2); ctx.fill();
        }
      }
      requestAnimationFrame(loop);
    })();
  </script>
