<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Territori</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100svh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b1a2b;
      font: 13px system-ui, sans-serif;
      color: #fff
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none
    }

    #menu {
      position: fixed;
      inset: 0;
      inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      box-sizing: border-box;
      overflow: auto;
      background: #0b1a2bee;
      z-index: 10
    }

    #menu h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 8vw, 42px)
    }

    input,
    button,
    select {
      min-height: 42px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 0;
      box-sizing: border-box
    }

    select {
      color: #111
    }

    button {
      background: #3b82f6;
      color: #fff;
      cursor: pointer
    }

    .h {
      position: fixed;
      background: #000b;
      padding: 6px 10px;
      border-radius: 6px
    }

    #top {
      left: 8px;
      top: 8px
    }

    #rank {
      right: 8px;
      top: 8px;
      max-height: 60vh;
      overflow: auto;
      font-size: 12px
    }

    .economic #rank {
      left: 8px;
      right: auto;
      top: auto;
      bottom: 8px;
      max-height: 35vh
    }

    .economic #rank div {
      grid-template-columns: 12px 72px 40px 38px 35px 52px
    }

    #rank div {
      display: grid;
      grid-template-columns: 12px 90px 52px 42px 44px;
      gap: 4px;
      white-space: nowrap
    }

    #bot {
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      text-align: center;
      display: none
    }

    #actions {
      position: fixed;
      left: 8px;
      top: 48px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 16px);
      background: #000b;
      padding: 6px 8px;
      border-radius: 6px
    }

    #econ-panel {
      position: fixed;
      display: none;
      right: 8px;
      top: 84px;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 100px);
      box-sizing: border-box;
      overflow: auto;
      padding: 12px;
      border: 1px solid #ffffff24;
      border-radius: 10px;
      background: #101c2eef;
      box-shadow: 0 12px 40px #0008;
      z-index: 3
    }

    #econ-panel.minimized {
      width: min(240px, calc(100vw - 24px));
      overflow: hidden
    }

    #econ-panel.minimized #econ-content {
      display: none
    }

    #econ-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      cursor: move;
      touch-action: none;
      user-select: none
    }

    #econ-panel h2,
    #econ-panel h3 {
      margin: 0 0 8px
    }

    #econ-panel h2 {
      font-size: 17px
    }

    #econ-panel h3 {
      font-size: 13px;
      color: #bfdbfe
    }

    .econ-title {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .econ-info {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border: 1px solid #93c5fd;
      border-radius: 50%;
      color: #bfdbfe;
      font: 10px/1 system-ui, sans-serif;
      cursor: help
    }

    #econ-toggle {
      flex: 0 0 auto;
      padding: 3px 8px;
      background: #2a3b55;
      font-size: 16px;
      line-height: 1.2;
      cursor: pointer
    }

    #econ-summary,
    #econ-workers,
    #econ-production {
      color: #b6c4d6;
      font-size: 11px
    }

    .econ-section {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ffffff24
    }

    .econ-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px
    }

    .econ-metric {
      display: grid;
      gap: 2px;
      padding: 6px;
      border-radius: 6px;
      background: #ffffff10
    }

    .econ-metric span {
      color: #b6c4d6;
      font-size: 10px
    }

    .econ-metric strong {
      font-size: 14px
    }

    .econ-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .econ-row input[type="range"] {
      width: 130px;
      padding: 0
    }

    .econ-row input[type="number"],
    #expedition-mode,
    #expedition-amount {
      width: 100px;
      padding: 5px 7px
    }

    #econ-requests,
    #econ-peace {
      display: grid;
      gap: 6px;
      max-height: 220px;
      overflow: auto
    }

    .ship-request,
    .ship-offer {
      display: grid;
      gap: 5px;
      padding: 6px;
      border-radius: 6px;
      background: #ffffff10
    }

    .ship-offer {
      grid-template-columns: 1fr auto auto;
      align-items: center;
      margin-top: 4px
    }

    .ship-request > .econ-row,
    .ship-request > input,
    .ship-request > button {
      min-width: 0
    }

    #econ-requests input {
      width: 76px;
      padding: 5px 6px
    }

    #econ-requests button,
    #econ-peace button {
      padding: 5px 7px;
      font-size: 12px
    }

    .econ-section button {
      padding: 5px 7px;
      font-size: 12px
    }

    #econ-panel .muted {
      color: #b6c4d6;
      font-size: 11px
    }

    @media (max-width: 700px) {
      #econ-panel {
        max-height: 48vh
      }

      .economic #rank {
        display: none
      }
    }

    #cm {
      position: fixed;
      display: none;
      background: #111e;
      border-radius: 8px;
      padding: 6px;
      min-width: 170px;
      max-width: calc(100vw - 24px);
      max-height: 80vh;
      box-sizing: border-box;
      overflow: auto;
      z-index: 5
    }

    #cm b {
      display: block;
      margin-bottom: 4px
    }

    #cm button {
      display: block;
      width: 100%;
      margin-top: 3px;
      text-align: left;
      background: #2a3b55
    }

    #card {
      position: fixed;
      display: none;
      pointer-events: none;
      background: #000d;
      padding: 6px 9px;
      border-radius: 6px;
      z-index: 4
    }

    @media (max-width: 700px) {
      #menu {
        justify-content: safe center
      }

      #menu input,
      #menu select,
      #menu button {
        width: min(380px, 100%);
        flex: 0 0 auto
      }

      #actions {
        top: calc(6px + env(safe-area-inset-top));
        left: calc(6px + env(safe-area-inset-left));
        right: calc(6px + env(safe-area-inset-right));
        max-width: none;
        gap: 5px;
        padding: 5px;
        font-size: 11px
      }

      #actions button,
      #actions input {
        min-height: 40px
      }

      #roomcode {
        overflow-wrap: anywhere
      }

      #top {
        top: calc(52px + env(safe-area-inset-top));
        left: calc(6px + env(safe-area-inset-left));
        max-width: min(70vw, 340px);
        font-size: 11px
      }

      #rank {
        top: auto;
        right: auto;
        bottom: calc(6px + env(safe-area-inset-bottom));
        left: calc(6px + env(safe-area-inset-left));
        max-width: 48vw;
        max-height: 22dvh;
        overflow: auto;
        font-size: 10px
      }

      #rank div {
        grid-template-columns: 10px minmax(42px, 1fr) 34px 35px 34px;
        gap: 3px
      }

      .economic #rank {
        display: block;
        max-height: 22dvh
      }

      .economic #top {
        display: none
      }

      .economic #rank div {
        grid-template-columns: 10px minmax(38px, 1fr) 31px 30px 30px 42px
      }

      #econ-panel {
        top: calc(58px + env(safe-area-inset-top));
        right: calc(6px + env(safe-area-inset-right));
        width: min(320px, calc(100vw - 12px - env(safe-area-inset-left) - env(safe-area-inset-right)));
        max-height: min(48dvh, 520px)
      }

      #econ-panel.minimized {
        width: min(200px, calc(100vw - 20px))
      }

      body[data-device-profile="tablet"] #econ-panel {
        max-height: min(68dvh, 680px)
      }

      #cm {
        min-width: min(190px, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        max-height: 55dvh;
        overflow: auto
      }

      #cm button {
        min-height: 42px;
        padding: 10px
      }
    }

    @media (max-width: 380px) {
      #actions {
        align-items: flex-start
      }

      #gamestate {
        flex: 1 1 100%
      }

      #roomcode {
        display: none
      }

      #top {
        max-width: calc(100vw - 12px - env(safe-area-inset-left) - env(safe-area-inset-right))
      }

      #rank {
        max-width: 46vw
      }

      #econ-panel {
        max-height: 46dvh
      }
    }

    body[data-device-profile="phone"] #actions {
      max-width: min(480px, calc(100vw - 16px))
    }

    body[data-device-profile="tablet"] #actions {
      max-width: min(760px, calc(100vw - 16px))
    }

    body[data-device-profile="tablet"] #econ-panel {
      max-height: min(68dvh, 680px)
    }

    body[data-device-profile="desktop"] #menu input,
    body[data-device-profile="desktop"] #menu select,
    body[data-device-profile="desktop"] #menu button {
      width: min(380px, calc(100vw - 32px))
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="menu">
    <h1>Territori</h1>
    <input id="name" placeholder="El teu nom" maxlength="16">
    <input id="room" placeholder="Codi de sala (buit = crear-ne una)" maxlength="4" style="text-transform:uppercase">
    <select id="mode">
      <option value="classic">Mode clàssic</option>
      <option value="economic">Mode econòmic: ciutats i fàbriques</option>
    </select>
    <select id="territory">
      <option value="random">Territori aleatori</option>
      <option value="americas">Amèriques</option>
      <option value="europe_africa">Europa i Àfrica</option>
      <option value="asia_pacific">Àsia i Oceania</option>
      <option value="world">Món sencer</option>
    </select>
    <select id="device-profile" aria-label="Perfil de dispositiu">
      <option value="auto">Dispositiu: automàtic</option>
      <option value="desktop">Jugar amb PC</option>
      <option value="tablet">Jugar amb tauleta</option>
      <option value="phone">Jugar amb mòbil</option>
    </select>
    <button id="go">Entrar</button>
  </div>
  <div class="h" id="top"></div>
  <div class="h" id="rank"></div>
  <div id="actions">
    <span id="gamestate"></span>
    <span id="roomcode"></span>
    <span id="pct-wrap">
      <label for="pct">Enviar a l’atac</label>
      <input id="pct" type="range" min="1" max="100" value="35">
      <span id="pl">35%</span>
    </span>
    <button id="start" style="display:none">Començar Partida</button>
    <button id="restart" style="display:none">Reiniciar Partida</button>
  </div>
  <aside id="econ-panel" aria-label="Gestió econòmica">
    <header id="econ-header">
      <div>
        <h2 class="econ-title">Economia <span class="econ-info" tabindex="0" title="Arrossega aquesta capçalera per moure el panell. Les icones d’informació expliquen cada opció." aria-label="Ajuda del panell">i</span></h2>
        <div id="econ-summary"></div>
      </div>
      <button id="econ-toggle" type="button" aria-expanded="true" aria-label="Minimitzar panell" title="Minimitzar">−</button>
    </header>
    <div id="econ-content">
    <section class="econ-section">
      <h3 class="econ-title">Població i exèrcit <span class="econ-info" tabindex="0" title="Els habitants civils generen ingressos i fabriquen vaixells. El percentatge militar determina la capacitat de soldats." aria-label="Informació de població i exèrcit">i</span></h3>
      <div class="econ-row">
        <label id="allocation-wrap" for="allocation" title="Percentatge d’habitants assignat a l’exèrcit">Soldats</label>
        <input id="allocation" type="range" min="0" max="100" step="1" value="35">
        <span id="allocation-label">35%</span>
      </div>
      <div id="econ-workers" class="muted" title="La densitat defensiva és el nombre de soldats per territori: com més baixa, més fàcil és que t’envaeixin."></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Economia i flota <span id="inventory-info" class="econ-info" tabindex="0" aria-label="Informació d’inventari">i</span></h3>
      <div id="econ-inventory" class="econ-metrics"></div>
      <div id="econ-production" class="muted"></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Expedicions <span class="econ-info" tabindex="0" title="Fes clic a terra lliure per expandir o a un enemic per atacar-ne la frontera. Les tropes segueixen una ruta; cal permís per travessar altres fronteres i un vaixell per cada 100 soldats a cada tram marítim." aria-label="Informació d’expedicions">i</span></h3>
      <div class="econ-row">
        <label for="expedition-mode">Quantitat</label>
        <select id="expedition-mode">
          <option value="percent">Percentatge de l’exèrcit</option>
          <option value="exact">Nombre exacte</option>
        </select>
      </div>
      <div class="econ-row" id="expedition-percent-row">
        <label for="expedition-percent">Percentatge</label>
        <input id="expedition-percent" type="range" min="1" max="100" value="35">
        <span id="expedition-percent-label">35%</span>
      </div>
      <div class="econ-row" id="expedition-exact-row" style="display:none">
        <label for="expedition-amount">Soldats</label>
        <input id="expedition-amount" type="number" min="5" step="1" value="100">
      </div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Demanar vaixells <span class="econ-info" tabindex="0" title="Publica una demanda amb quantitat i preu màxim en euros per vaixell. Jugadors i bots poden fer ofertes; tu decideixes quina acceptes." aria-label="Informació de demandes">i</span></h3>
      <div class="econ-row">
        <input id="ship-request-quantity" type="number" min="1" step="1" value="1" aria-label="Nombre de vaixells que demanes">
        <input id="ship-request-price" type="number" min="1" step="1" value="1500" aria-label="Preu màxim en euros per vaixell">
        <button id="ship-request-create">Demanar</button>
      </div>
      <div class="econ-row">
        <span>Vaixells</span>
        <span>Màx. €/unitat</span>
      </div>
      <div id="econ-requests"></div>
    </section>
    <section class="econ-section">
      <h3 class="econ-title">Pau i diplomàcia <span class="econ-info" tabindex="0" title="Si t’estan atacant, proposa un pagament en euros. Si l’atacant accepta, es cancel·la l’atac i comença un alto el foc de 120 segons." aria-label="Informació de diplomàcia">i</span></h3>
      <div id="econ-peace"></div>
    </section>
    </div>
  </aside>
  <div class="h" id="bot">
    <div id="hint"></div>
    <div id="code"></div>
  </div>
  <div id="cm"></div>
  <div id="card"></div>
  <script>
    const $ = id => document.getElementById(id);
    let ws, W, H, NB, me, owner, structures, structureList = [], gameMode = 'classic', off, octx, img, land = 1, zoom = 3, ox = 0, oy = 0, dirty = false, pm = {}, economy = {}, shipRequests = [], peaceOffers = [], marches = [], threats = {}, ceasefires = [], boats = [], gameState = 'lobby', host = 0, winner = 0, allies = new Set();
    const cv = $('c'), ctx = cv.getContext('2d');
    function fitMap() {
      if (!off) return;
      zoom = Math.min(innerWidth / W, innerHeight / H) * .95;
      ox = (innerWidth - W * zoom) / 2;
      oy = (innerHeight - H * zoom) / 2;
    }
    function detectDeviceProfile() {
      const shortSide = Math.min(innerWidth, innerHeight);
      const touchDevice = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
      if (shortSide <= 600) return 'phone';
      if (touchDevice && Math.max(innerWidth, innerHeight) <= 1400) return 'tablet';
      return 'desktop';
    }
    function applyDeviceProfile() {
      const requested = $('device-profile').value;
      document.body.dataset.deviceProfile = requested === 'auto' ? detectDeviceProfile() : requested;
    }
    function resize() {
      cv.width = innerWidth;
      cv.height = innerHeight;
      fitMap();
      applyDeviceProfile();
    }
    onresize = resize; resize();
    function hsl(h) { const s = .6, l = .5, a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))) }; return [f(0), f(8), f(4)] }
    function color(id, i) { if (id === 255) return [14, 40, 72]; if (!id) return (i / W | 0) < H * .1 ? [205, 215, 222] : [62, 98, 66]; if (id <= NB) return hsl(id * 47 % 360); return id === me ? [59, 130, 246] : [34, 211, 238] }
    function paint(i) { const c = color(owner[i], i), d = img.data; d[4 * i] = c[0]; d[4 * i + 1] = c[1]; d[4 * i + 2] = c[2]; d[4 * i + 3] = 255; }
    $('device-profile').onchange = applyDeviceProfile;
    $('name').value = localStorage.nom || '';
    $('room').oninput = () => {
      $('mode').disabled = !!$('room').value;
      $('territory').disabled = !!$('room').value;
    };
    $('go').onclick = () => {
      localStorage.nom = $('name').value;
      ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host);
      ws.onopen = () => ws.send(JSON.stringify({
        t: 'join',
        name: $('name').value || 'Jugador',
        room: $('room').value,
        mode: $('mode').value,
        territory: $('territory').value
      }));
      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.t === 'err') {
          if (!(gameMode === 'classic' && m.m === 'Una expedicio necessita almenys 5 soldats.')) alert(m.m);
        }
        else if (m.t === 'init') {
          W = m.w; H = m.h; NB = m.nb; me = m.me; land = m.land; gameState = m.state; host = m.host; gameMode = m.mode;
          owner = Uint8Array.from(atob(m.owner), c => c.charCodeAt(0));
          structures = Uint8Array.from(atob(m.structures), c => c.charCodeAt(0)); rebuildStructureList();
          off = document.createElement('canvas'); off.width = W; off.height = H; octx = off.getContext('2d'); img = octx.createImageData(W, H);
          for (let i = 0; i < W * H; i++)paint(i); dirty = true;
          fitMap();
          $('menu').style.display = 'none';
          $('roomcode').textContent = 'Codi de sala: ' + m.code;
          $('code').textContent = 'Sala: ' + m.code + ' (passa-li el codi al teu amic)';
          $('territory').value = m.territory;
          updateControls();
        }
        else if (m.t === 'reset') { owner = Uint8Array.from(atob(m.owner), c => c.charCodeAt(0)); structures = Uint8Array.from(atob(m.structures), c => c.charCodeAt(0)); rebuildStructureList(); boats = []; marches = []; shipRequests = []; peaceOffers = []; ceasefires = []; threats = {}; for (let i = 0; i < W * H; i++) paint(i); dirty = true; gameState = 'lobby'; winner = 0; allies.clear(); updateControls(); }
        else if (m.t === 'd') { for (let k = 0; k < m.c.length; k += 2) { owner[m.c[k]] = m.c[k + 1]; paint(m.c[k]); } dirty = true; }
        else if (m.t === 'building') {
          structures[m.i] = m.type;
          structureList = structureList.filter(([i]) => i !== m.i);
          if (m.type) structureList.push([m.i, m.type]);
        }
        else if (m.t === 'b') boats = m.b;
        else if (m.t === 's') {
          gameState = m.state; host = m.host; winner = m.winner; gameMode = m.mode;
          economy = Object.fromEntries((m.economy || []).map(p => [p.id, p]));
          shipRequests = m.shipRequests || [];
          peaceOffers = m.peaceOffers || [];
          marches = m.marches || [];
          threats = Object.fromEntries(m.threats || []);
          ceasefires = m.ceasefires || [];
          allies = new Set(m.allies.map(x => x.slice().sort((a, b) => a - b).join(':')));
          stats(m.p); updateControls(); updateEconomicPanel();
        }
        else if (m.t === 'peaceOffer') {
          const accept = confirm(`${m.name} ofereix ${m.amount.toLocaleString('ca-ES')} € per aturar l’atac durant 120 segons. Acceptes?`);
          send({ t: 'peaceReply', offer: m.id, accept });
        }
        else if (m.t === 'peaceResult') alert(m.accepted
          ? `Pau acceptada amb ${m.name}. Import: ${m.amount.toLocaleString('ca-ES')} €.`
          : `${m.name} ha rebutjat la proposta de pau.`);
        else if (m.t === 'pactRequest' && confirm(`${m.name} et proposa un pacte. Vols acceptar-lo?`)) send({ t: 'pactReply', from: m.from, accept: true });
        else if (m.t === 'pactRequest') send({ t: 'pactReply', from: m.from, accept: false });
      };
    };
    const alive = () => pm[me] && pm[me][4];
    function rebuildStructureList() {
      structureList = [];
      for (let i = 0; i < structures.length; i++)if (structures[i]) structureList.push([i, structures[i]]);
    }
    function updateControls() {

      $('gamestate').textContent = gameState === 'lobby' ? 'Sala d’espera' : gameState === 'playing' ? 'Partida en marxa' : winner ? `${pm[winner]?.[1] || 'Jugador'} ha guanyat` : 'Partida acabada';
    }
    function stats(p) {

      $('top').textContent = q && q[4] ? gameMode === 'economic'
        ? `Soldats: ${q[3]} · Habitants: ${q[10]} · Euros: ${Math.floor(q[6]).toLocaleString('ca-ES')} · Ciutats: ${q[8]}`

        : 'Encara no has aparegut';
      if (q && gameMode === 'economic') {

        : 'Fes clic esquerre a terra lliure, lluny d\'altres, per aparèixer';
      const R = $('rank'); R.textContent = '';
      const row = (a) => { const d = document.createElement('div'); a.forEach((t, i) => { const s = document.createElement('span'); if (i === 0) { const c = color(t, 0); s.style.cssText = `background:rgb(${c});height:10px;margin-top:3px`; } else s.textContent = t; d.appendChild(s); }); R.appendChild(d); return d; };
      const headings = gameMode === 'economic'

      const header = row(headings);

      p.filter(x => x[4]).sort((a, b) => b[2] - a[2]).forEach(x => {
        const detail = gameMode === 'economic' ? Math.floor(x[10]) : (x[5] * 100).toFixed(1) + '%';
        const values = [x[0], x[1], x[3], detail, (x[2] / land * 100).toFixed(1) + '%'];
        if (gameMode === 'economic') values.push((x[3] / Math.max(x[2], 1)).toFixed(1));

    }
    function updateEconomicPanel() {

      $('econ-summary').textContent = `${Math.floor(q[10])} habitants · ${Math.floor(e.money).toLocaleString('ca-ES')} €`;
      const defenseDensity = q[3] / Math.max(q[2], 1);

      const inventory = $('econ-inventory');

      $('inventory-info').title = `Els civils generen ${e.incomeRate.toFixed(1)} €/s. Cada fàbrica d’armes augmenta un 10% l’eficàcia d’atac i defensa (màxim +100%). Drassanes: ${e.shipyards} · fàbriques d’armes: ${e.armsFactories}.`;
      renderShipRequests();

    function renderShipRequests() {
      const root = $('econ-requests'); root.textContent = '';

        const card = document.createElement('div'); card.className = 'ship-request';
        const title = document.createElement('div');

              !inventory || amount > inventory.ships;

          price.oninput = updateOfferButton;

          const row = document.createElement('div'); row.className = 'ship-offer';
          const label = document.createElement('span');

          row.appendChild(label);

            const quantity = document.createElement('input');

            };
            quantity.oninput = updateAcceptButton;
            updateAcceptButton();
            accept.onclick = () => send({ t: 'shipAccept', offer: offer.id, quantity: Number(quantity.value) });
            row.append(quantity, accept);
          } else if (offer.seller === me) {
            const cancel = document.createElement('button');
            cancel.textContent = 'Retirar oferta';
            cancel.onclick = () => send({ t: 'shipOfferCancel', offer: offer.id });
            row.appendChild(cancel);

          card.appendChild(row);

      if (!root.childElementCount) root.textContent = 'No hi ha demandes actives.';
    }
    function renderPeace() {
      const root = $('econ-peace'); root.textContent = '';
      for (const offer of peaceOffers.filter(item => item.to === me)) {
        const row = document.createElement('div'); row.className = 'ship-offer';
        const label = document.createElement('span');
        label.textContent = `${offer.name} ofereix ${offer.amount.toLocaleString('ca-ES')} € per la pau`;
        const accept = document.createElement('button'); accept.textContent = 'Acceptar';
        accept.onclick = () => send({ t: 'peaceReply', offer: offer.id, accept: true });

      }
      for (const [a, b, ticks] of ceasefires) {
        if (a !== me && b !== me) continue;
        const other = pm[a === me ? b : a];
        const label = document.createElement('div');
        label.textContent = `Alto el foc amb ${other ? other[1] : 'jugador'} · ${Math.ceil(ticks * .2)} s`;
        root.appendChild(label);
      }
      if (!root.childElementCount) root.textContent = 'Cap tracte de pau actiu.';
    }
    const econPanel = $('econ-panel'), econHeader = $('econ-header');
    $('econ-toggle').onclick = () => {
      const minimized = econPanel.classList.toggle('minimized');
      $('econ-toggle').textContent = minimized ? '+' : '−';
      $('econ-toggle').title = minimized ? 'Ampliar' : 'Minimitzar';
      $('econ-toggle').setAttribute('aria-label', minimized ? 'Ampliar panell' : 'Minimitzar panell');
      $('econ-toggle').setAttribute('aria-expanded', String(!minimized));
    };
    let panelDrag = null;
    econHeader.addEventListener('pointerdown', e => {

    econHeader.addEventListener('pointermove', e => {

      econPanel.style.right = 'auto';
      econPanel.style.top = `${top}px`;
    });
    const stopPanelDrag = () => { panelDrag = null; };
    econHeader.addEventListener('pointerup', stopPanelDrag);
    econHeader.addEventListener('pointercancel', stopPanelDrag);
    window.addEventListener('resize', () => {
      if (!econPanel.style.left) return;
      const rect = econPanel.getBoundingClientRect();
      econPanel.style.left = `${Math.max(8, Math.min(innerWidth - rect.width - 8, rect.left))}px`;
      econPanel.style.top = `${Math.max(8, Math.min(innerHeight - rect.height - 8, rect.top))}px`;
    });
    $('start').onclick = () => send({ t: 'start' });
    $('restart').onclick = () => send({ t: 'restart' });
    $('pct').oninput = () => $('pl').textContent = $('pct').value + '%';
    $('allocation').oninput = () => $('allocation-label').textContent = `${$('allocation').value}%`;
    $('allocation').onchange = () => send({ t: 'allocate', value: $('allocation').value });
    $('expedition-mode').onchange = () => {
      const exact = $('expedition-mode').value === 'exact';
      $('expedition-percent-row').style.display = exact ? 'none' : 'flex';
      $('expedition-exact-row').style.display = exact ? 'flex' : 'none';
    };
    $('expedition-percent').oninput = () => $('expedition-percent-label').textContent = `${$('expedition-percent').value}%`;
    $('ship-request-create').onclick = () => send({
      t: 'shipRequest',
      quantity: Number($('ship-request-quantity').value),
      maxPrice: Number($('ship-request-price').value)
    });
    const tile = e => [Math.floor((e.clientX - ox) / zoom), Math.floor((e.clientY - oy) / zoom)];
    const send = o => ws.send(JSON.stringify(o));
    const pct = () => gameMode === 'economic' ? Number($('expedition-percent').value) / 100 : Number($('pct').value) / 100;
    function sendExpedition(t, x, y, betray = false) {
      const selection = gameMode === 'economic'
        ? $('expedition-mode').value === 'exact'
          ? { expeditionMode: 'exact', amount: Number($('expedition-amount').value) }
          : { expeditionMode: 'percent' }
        : {};

    }
    function infoLine(id) {
      const p = pm[id];
      return p ? gameMode === 'economic'
        ? `${p[1]} — Exèrcit ${p[3]} · Habitants ${p[10]}`
        : `${p[1]} — Tropes ${p[3]} · Int. ${(p[5] * 100).toFixed(1)}% · Terra ${(p[2] / land * 100).toFixed(1)}%`
        : '';
    }
    function menu(e, x, y) {
      const cm = $('cm'); cm.textContent = '';
      const o = x >= 0 && y >= 0 && x < W && y < H ? owner[y * W + x] : 255;
      const add = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { cm.style.display = 'none'; f(); }; cm.appendChild(b); };
      const h = document.createElement('b'); h.textContent = o === 255 ? 'Mar' : o === 0 ? 'Terra lliure' : o === me ? 'El teu territori' : infoLine(o); cm.appendChild(h);
      if (alive()) {
        const isAlly = o > NB && allies.has([me, o].sort((a, b) => a - b).join(':'));
        if (gameMode === 'economic' && gameState === 'playing' && o === me && !structures[y * W + x]) {
          const q = pm[me];
          if (q[6] >= 2500 && (!q[8] || q[10] >= q[8] * 1000)) add('Construir ciutat (2.500 €)', () => send({ t: 'build', i: y * W + x, building: 'city' }));
          if (q[8] > 0 && q[9] < 10) {
            if (q[6] >= 4000) add('Construir drassana (4.000 €)', () => send({ t: 'build', i: y * W + x, building: 'shipyard' }));
            if (q[6] >= 3500) add('Construir fàbrica d’armes (3.500 €)', () => send({ t: 'build', i: y * W + x, building: 'armsFactory' }));
          }
        }
        if (gameState === 'playing' && o > NB && o !== me) {
          [10, 25, 50].forEach(p => add(`Donar ${p}% de tropes`, () => send({ t: 'give', to: o, pct: p / 100 })));
          if (!isAlly) add('Proposar pacte', () => send({ t: 'pact', to: o }));
        }
        if (gameMode === 'economic' && gameState === 'playing' && o !== me && o > 0 && o !== 255 &&
            (threats[me] || []).includes(o)) {
          add('Oferir pau pagada', () => {
            const amount = Number(prompt(`Quants euros ofereixes per aturar l’atac de ${pm[o]?.[1] || 'aquest jugador'} durant 120 segons?`));
            if (Number.isSafeInteger(amount) && amount > 0) send({ t: 'peaceOffer', to: o, amount });
          });
        }
        if (gameState === 'playing' && o !== me && o !== 255) {
          const label = gameMode === 'economic' ? 'Enviar exèrcit' : 'Atacar';
          if (isAlly) add(`Trair pacte i ${label.toLowerCase()}`, () => sendExpedition('atk', x, y, true));
          else add(label, () => sendExpedition('atk', x, y));
        }
        if (gameState === 'playing' && o !== me) {
          const label = gameMode === 'economic' ? 'Enviar exèrcit per mar' : 'Enviar vaixell';
          if (isAlly) add(`Trair pacte i ${label.toLowerCase()}`, () => sendExpedition('boat', x, y, true));
          else add(label, () => sendExpedition('boat', x, y));
        }
      } else if (o === 0) add('Aparèixer aquí', () => send({ t: 'spawn', x, y }));
      cm.style.display = 'block';
      const rect = cm.getBoundingClientRect();
      cm.style.left = `${Math.max(8, Math.min(e.clientX, innerWidth - rect.width - 8))}px`;
      cm.style.top = `${Math.max(8, Math.min(e.clientY, innerHeight - rect.height - 8))}px`;
    }
    const activePointers = new Map();
    let drag = null, moved = 0, pressTimer = null, longPress = false, pinch = null;
    function clearPressTimer() {
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = null;
    }
    function performMapAction(e, button) {
      if (!ws || !owner) return;
      const [x, y] = tile(e);
      if (button === 2) menu(e, x, y);
      else if (button === 0) {
        if (!alive()) send({ t: 'spawn', x, y });
        else if (gameState === 'playing') sendExpedition('atk', x, y);

    function pointerMidpoint(points) {
      const [a, b] = points;

    }
    cv.onpointerdown = e => {
      if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 2) return;
      if (e.pointerType !== 'mouse') e.preventDefault();
      $('cm').style.display = 'none';
      cv.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType, button: e.button });
      if (activePointers.size === 2 && [...activePointers.values()].every(pointer => pointer.type !== 'mouse')) {
        clearPressTimer();
        drag = null;
        moved = Infinity;
        const points = [...activePointers.values()];
        const midpoint = pointerMidpoint(points);
        pinch = {
          distance: Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y),
          zoom,
          anchorX: (midpoint.x - ox) / zoom,
          anchorY: (midpoint.y - oy) / zoom
        };
        return;
      }
      if (activePointers.size !== 1) return;

      moved = 0;
      longPress = false;
      if (e.pointerType !== 'mouse' && alive() && gameState === 'playing') {
        pressTimer = setTimeout(() => {
          if (!drag || drag.pointerId !== e.pointerId || moved > 6) return;

        drag.y = e.clientY;

      if (!owner || e.target !== cv || drag) { card.style.display = 'none'; return; }

      if (ownerId > 0 && ownerId < 255 && pm[ownerId]) {

          const [pointerId, point] = remaining.value;

    cv.onpointercancel = e => finishPointer(e, true);

      const f = e.deltaY < 0 ? 1.15 : 1 / 1.15, z = Math.min(30, Math.max(1, zoom * f));
      ox = e.clientX - (e.clientX - ox) * z / zoom; oy = e.clientY - (e.clientY - oy) * z / zoom; zoom = z;
    };
    (function loop() {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b1a2b'; ctx.fillRect(0, 0, cv.width, cv.height);
      if (off) {
        if (dirty) { octx.putImageData(img, 0, 0); dirty = false; }
        ctx.imageSmoothingEnabled = false; ctx.setTransform(zoom, 0, 0, zoom, ox, oy); ctx.drawImage(off, 0, 0);
        const buildingSize = Math.max(.8, 2 / zoom);
        for (const [i, type] of structureList) {
          const x = i % W, y = (i / W) | 0;
          ctx.fillStyle = type === 1 ? '#fbbf24' : type === 2 ? '#22d3ee' : type === 3 ? '#60a5fa' : '#f87171';
          ctx.fillRect(x - buildingSize / 2, y - buildingSize / 2, buildingSize, buildingSize);
          if (type > 1) {
            ctx.fillStyle = '#475569';
            ctx.fillRect(x + buildingSize * .12, y - buildingSize * .7, buildingSize * .24, buildingSize * .38);
          }
        }
        for (const b of boats) { ctx.fillStyle = '#fff'; ctx.fillRect(b[0] - 1.5, b[1] - 1.5, 3, 3); ctx.fillStyle = `rgb(${color(b[2], 0)})`; ctx.fillRect(b[0] - 1, b[1] - 1, 2, 2); }
        for (const march of marches) {
          ctx.fillStyle = march[3] ? '#fbbf24' : `rgb(${color(march[2], 0)})`;
          ctx.beginPath(); ctx.arc(march[0], march[1], Math.max(1.5, 3 / zoom), 0, Math.PI * 2); ctx.fill();
        }
      }
      requestAnimationFrame(loop);
    })();
  </script>
